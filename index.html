    /* ===== '뭘먹지' 맛집 추천 뷰 구현 (GPS/주소 기반 스위치, 3단계 셀렉트, 반경, 카테고리, 취향별, 나의 메뉴) ===== */

    // 네이버 지도 검색 주소 (구 m.map.naver.com/search2 주소는 더 이상 동작하지 않아 현행 웹 지도 주소로 변경)
    function naverSearchUrl(query) {
      return 'https://map.naver.com/p/search/' + encodeURIComponent(query);
    }
    function foodEsc(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 좌표 → 한국식 주소 문자열 (예: 서울시 영등포구 신길로 41가길 34)
    function formatKoAddress(a) {
      const norm = t => (t || '').replace(/(특별자치시|특별시|광역시)$/, '시');
      const road = (a.road || '').replace(/(로|길)(\d)/, '$1 $2');
      const parts = [
        norm(a.state || a.province),
        norm(a.city || a.town),
        a.borough || a.city_district || a.county || a.district || '',
        ...(road ? [road, a.house_number || ''] : [a.suburb || a.quarter || a.neighbourhood || a.village || ''])
      ].filter(Boolean);
      return [...new Set(parts)].join(' ').trim();
    }
    async function reverseGeocode(lat, lon) {
      try {   // 1순위: OpenStreetMap Nominatim (키 불필요, 도로명 단위)
        const j = await fetchJSONTimeout(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=ko`, 8000);
        const addr = formatKoAddress(j.address || {});
        if (addr) return addr;
      } catch (e) {}
      try {   // 2순위: BigDataCloud (키 불필요, 동 단위)
        const j = await fetchJSONTimeout(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`, 8000);
        const norm = t => (t || '').replace(/(특별자치시|특별시|광역시)$/, '시');
        const addr = [...new Set([norm(j.principalSubdivision), j.city, j.locality].filter(Boolean))].join(' ');
        if (addr) return addr;
      } catch (e) {}
      return '';
    }
    function gpsStatusText() {
      const c = currentGpsCoords;
      if (gpsBusy) return '현재 위치: 확인 중...';
      if (!c.real) return "현재 위치: 아직 확인되지 않았습니다. [현재 위치 갱신]을 눌러 주세요.";
      return `현재 위치: 위도:${c.lat.toFixed(2)}, 경도:${c.lon.toFixed(2)}` + (c.addressName ? ` / ${c.addressName}` : '');
    }
    function updateGpsStatus() {
      const el = document.getElementById('gpsStatusText');
      if (el) el.textContent = gpsStatusText();
    }
    async function refreshGps(manual) {
      if (!navigator.geolocation) {
        if (manual) alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
        return false;
      }
      gpsBusy = true; updateGpsStatus();
      try {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }));
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        currentGpsCoords = { lat, lon, addressName: '', real: true };
        gpsBusy = false; updateGpsStatus();
        const addr = await reverseGeocode(lat, lon);
        currentGpsCoords.addressName = addr;
        updateGpsStatus();
        if (manual) alert('현재 위치가 성공적으로 갱신되었습니다.' + (addr ? '' : ' (주소는 확인하지 못했습니다)'));
        return true;
      } catch (err) {
        gpsBusy = false; updateGpsStatus();
        if (manual) alert('GPS 위치를 가져오지 못했습니다: ' + (err && err.message ? err.message : err));
        return false;
      }
    }

    function renderFoodView() {
      foodContainerEl.innerHTML = '';

      if (!appState.settings) appState.settings = {};
      if (!appState.settings.foodSearch) {
        appState.settings.foodSearch = {
          mode: "gps",
          sido: "서울",
          gungoo: "종로구",
          dong: "",
          radius: "1km",
          category: "전체 맛집",
          situation: "",
          price: "",
          parking: false
        };
      }
      if (!appState.settings.foodFavorites) {
        appState.settings.foodFavorites = [];
      }

      const fState = appState.settings.foodSearch;
      if (!FOOD_CATEGORIES.includes(fState.category)) {
        fState.category = FOOD_CATEGORY_MIGRATE[fState.category] || '전체 맛집';
      }

      const mainCard = document.createElement('div');
      mainCard.className = 'food-card';

      // 1. 모드 선택 스위치 (GPS중심 vs 주소중심)
      const switchRow = document.createElement('div');
      switchRow.innerHTML = `
        <div style="font-weight:800; font-size:1.1rem; margin-bottom:0.5rem;"><i class="fa-solid fa-utensils" style="color:var(--primary-color);"></i> 위치 선택</div>
        <div class="switch-group">
          <button class="switch-btn ${fState.mode === 'gps' ? 'active' : ''}" id="modeGpsBtn"><i class="fa-solid fa-location-crosshairs"></i> GPS중심</button>
          <button class="switch-btn ${fState.mode === 'address' ? 'active' : ''}" id="modeAddrBtn"><i class="fa-solid fa-map-location-dot"></i> 주소중심</button>
        </div>
      `;
      mainCard.appendChild(switchRow);

      // 2. 위치 설정 영역 (GPS 또는 주소 3단계)
      const locationArea = document.createElement('div');
      locationArea.className = 'form-row';
      locationArea.style.background = 'rgba(0,0,0,0.02)';
      locationArea.style.padding = '0.8rem';
      locationArea.style.borderRadius = '8px';
      locationArea.style.border = '1px solid var(--border-color)';

      if (fState.mode === 'gps') {
        locationArea.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:0.5rem;">
            <div style="min-width:0; flex:1 1 220px;">
              <div style="font-weight:700; font-size:0.92rem;"><i class="fa-solid fa-satellite-dish" style="color:var(--primary-color);"></i> GPS 기반 맛집 탐색</div>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:2px; word-break:keep-all; overflow-wrap:anywhere;" id="gpsStatusText">${gpsStatusText()}</div>
            </div>
            <button class="btn-primary" id="getGpsBtn" style="font-size:0.82rem; padding:0.35rem 0.8rem;"><i class="fa-solid fa-location-crosshairs"></i> 현재 위치 갱신</button>
          </div>
        `;
      } else {
        const sidoList = Object.keys(regionGroups);
        const sidoOptions = sidoList.map(s => `<option value="${s}" ${s === fState.sido ? 'selected' : ''}>${s}</option>`).join('');

        let gungooOptions = '';
        if (regionGroups[fState.sido]) {
          gungooOptions = regionGroups[fState.sido].map(g => `<option value="${g.name}" ${g.name === fState.gungoo ? 'selected' : ''}>${g.name}</option>`).join('');
        }

        locationArea.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:0.5rem; width:100%;">
            <div style="font-weight:700; font-size:0.92rem;"><i class="fa-solid fa-map" style="color:var(--primary-color);"></i> 주소 기반 맛집 탐색</div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <div class="form-group" style="flex:1; min-width:120px;">
                <label>1단계: 시/도 (필수)</label>
                <select class="food-select" id="addrSidoSelect" style="width:100%;">${sidoOptions}</select>
              </div>
              <div class="form-group" style="flex:1; min-width:120px;">
                <label>2단계: 시/군/구 (필수)</label>
                <select class="food-select" id="addrGungooSelect" style="width:100%;">${gungooOptions}</select>
              </div>
              <div class="form-group" style="flex:1; min-width:120px;">
                <label>3단계: 상세주소 (선택)</label>
                <input type="text" id="addrDongInput" class="food-select" placeholder="예: 신길로 34가길 34" value="${foodEsc(fState.dong || '')}" style="width:100%; height:34px;">
              </div>
            </div>
          </div>
        `;
      }
      mainCard.appendChild(locationArea);

      // 3. 반경 필터 설정
      const radiusRow = document.createElement('div');
      radiusRow.className = 'form-row';
      const radii = ["300m", "500m", "1km", "2km", "5km"];
      let radiusChips = radii.map(r => `<button class="tag-chip ${fState.radius === r ? 'active' : ''}" data-radius="${r}">${r}</button>`).join('');
      radiusRow.innerHTML = `
        <span style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">거리 반경:</span>
        <div style="display:flex; gap:0.3rem; flex-wrap:wrap;" id="radiusChipsContainer">${radiusChips}</div>
      `;
      mainCard.appendChild(radiusRow);

      // 4. 카테고리 선택 (필수 옵션)
      const catBox = document.createElement('div');
      catBox.style.display = 'flex';
      catBox.style.flexDirection = 'column';
      catBox.style.gap = '0.5rem';
      catBox.innerHTML = `
        <div style="font-size:0.88rem; font-weight:700;"><i class="fa-solid fa-list"></i> 카테고리 선택 (필수)</div>
        <div class="food-category-grid" id="foodCatGrid"></div>
      `;
      mainCard.appendChild(catBox);

      const catGridEl = catBox.querySelector('#foodCatGrid');
      FOOD_CATEGORIES.forEach(cat => {
        const chip = document.createElement('div');
        chip.className = `category-chip ${fState.category === cat ? 'active' : ''}`;
        chip.textContent = cat;
        chip.onclick = () => {
          fState.category = cat;
          saveState();
          renderFoodView();
        };
        catGridEl.appendChild(chip);
      });

      // 5. 상황별·취향별 필터링 (선택 옵션) - 한 줄 나열
      const optionsRow = document.createElement('div');
      optionsRow.style.display = 'flex';
      optionsRow.style.flexDirection = 'column';
      optionsRow.style.gap = '0.5rem';
      optionsRow.innerHTML = `
        <div style="font-size:0.88rem; font-weight:700;"><i class="fa-solid fa-sliders"></i> 상황별·취향별 필터링 (선택)</div>
        <div class="food-filter-row" id="situationTags">
          <button class="tag-chip ${fState.situation === '혼밥' ? 'active' : ''}" data-sit="혼밥">혼밥</button>
          <button class="tag-chip ${fState.situation === '회식' ? 'active' : ''}" data-sit="회식">회식</button>
          <button class="tag-chip ${fState.situation === '데이트' ? 'active' : ''}" data-sit="데이트">데이트</button>
          <select class="food-select" id="priceFilterSelect" title="가격대">
            <option value="">가격대</option>
            <option value="가성비" ${fState.price === '가성비' ? 'selected' : ''}>가성비</option>
            <option value="일반" ${fState.price === '일반' ? 'selected' : ''}>일반</option>
            <option value="고급" ${fState.price === '고급' ? 'selected' : ''}>고급</option>
          </select>
          <label class="food-parking"><input type="checkbox" id="parkingCheck" ${fState.parking ? 'checked' : ''}> 주차가능</label>
        </div>
      `;
      mainCard.appendChild(optionsRow);

      // 6. '추천해죠' 버튼 및 결과 상자
      const actionRow = document.createElement('div');
      actionRow.style.textAlign = 'center';
      actionRow.style.marginTop = '0.5rem';
      actionRow.innerHTML = `
        <button class="btn-primary" id="recommendBtn" style="padding: 0.7rem 2rem; font-size: 1rem;"><i class="fa-solid fa-wand-magic-sparkles"></i> 추천해죠!</button>
      `;
      mainCard.appendChild(actionRow);

      const resultBox = document.createElement('div');
      resultBox.id = 'recommendResultBox';
      resultBox.style.display = 'none';
      mainCard.appendChild(resultBox);

      foodContainerEl.appendChild(mainCard);

      // 7. 나의 메뉴 카드 추가
      const favCard = document.createElement('div');
      favCard.className = 'food-card';
      favCard.innerHTML = `
        <div style="font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:0.5rem;">
          <i class="fa-solid fa-star" style="color:#f1c40f;"></i> 나의 메뉴 (<span id="favCount">0</span>/100)
        </div>
        <div class="favorite-list" id="favoriteListContainer"></div>
      `;
      foodContainerEl.appendChild(favCard);

      renderFavoritesList();

      // 이벤트 바인딩
      setTimeout(() => {
        document.getElementById('modeGpsBtn').onclick = () => {
          fState.mode = 'gps';
          saveState();
          renderFoodView();
        };
        document.getElementById('modeAddrBtn').onclick = () => {
          fState.mode = 'address';
          saveState();
          renderFoodView();
        };

        if (fState.mode === 'gps') {
          document.getElementById('getGpsBtn').onclick = () => refreshGps(true);
          // 처음 GPS 화면을 열었을 때 한 번 자동으로 현재 위치 확인 (실패해도 조용히 넘어감)
          if (!currentGpsCoords.real && !gpsAutoTried) {
            gpsAutoTried = true;
            refreshGps(false);
          }
        } else {
          const sidoSel = document.getElementById('addrSidoSelect');
          const gungooSel = document.getElementById('addrGungooSelect');
          const dongInput = document.getElementById('addrDongInput');

          sidoSel.onchange = (e) => {
            fState.sido = e.target.value;
            const firstG = regionGroups[fState.sido] && regionGroups[fState.sido][0] ? regionGroups[fState.sido][0].name : '';
            fState.gungoo = firstG;
            saveState();
            renderFoodView();
          };

          gungooSel.onchange = (e) => {
            fState.gungoo = e.target.value;
            saveState();
            renderFoodView();
          };

          // 상세주소는 입력할 때마다 저장되어, 다음에 열면 마지막 입력값이 그대로 표시됨
          dongInput.oninput = (e) => {
            fState.dong = e.target.value;
            saveState();
          };
        }

        // 반경 버튼 이벤트
        document.querySelectorAll('#radiusChipsContainer .tag-chip').forEach(btn => {
          btn.onclick = () => {
            fState.radius = btn.getAttribute('data-radius');
            saveState();
            renderFoodView();
          };
        });

        // 상황별 태그 이벤트
        document.querySelectorAll('#situationTags .tag-chip').forEach(btn => {
          btn.onclick = () => {
            const sit = btn.getAttribute('data-sit');
            fState.situation = fState.situation === sit ? '' : sit;
            saveState();
            renderFoodView();
          };
        });

        document.getElementById('priceFilterSelect').onchange = (e) => {
          fState.price = e.target.value;
          saveState();
        };

        document.getElementById('parkingCheck').onchange = (e) => {
          fState.parking = e.target.checked;
          saveState();
        };

        // 추천해죠 버튼 클릭 이벤트
        document.getElementById('recommendBtn').onclick = async () => {
          const cat = fState.category;
          let pool = [];
          if (cat === '전체 맛집') {
            Object.values(MENU_DATABASE).forEach(arr => pool.push(...arr));
          } else {
            pool = MENU_DATABASE[cat] || ["대표 맛집 메뉴"];
          }

          const pickedMenu = pool[Math.floor(Math.random() * pool.length)];

          // GPS 모드인데 아직 위치를 못 받았다면 먼저 한 번 시도
          if (fState.mode === 'gps' && !currentGpsCoords.real) {
            await refreshGps(false);
          }

          // displayLoc: 화면 표시용, searchLoc: 검색어용 (좌표 숫자는 검색에 쓰지 않고 주소만 사용)
          let displayLoc = '', searchLoc = '';
          if (fState.mode === 'gps') {
            const c = currentGpsCoords;
            if (c.real) {
              displayLoc = `위도:${c.lat.toFixed(2)}, 경도:${c.lon.toFixed(2)}` + (c.addressName ? ` / ${c.addressName}` : '');
              searchLoc = c.addressName || '';
            } else {
              displayLoc = '현재 위치 미확인';
            }
          } else {
            const detail = (fState.dong || '').trim();   // 상세주소가 있으면 그 주소 기준으로 검색
            displayLoc = `${fState.sido} ${fState.gungoo} ${detail}`.trim();
            searchLoc = displayLoc;
          }

          // 상황별·취향별 조건도 검색어에 반영
          const extras = [];
          if (fState.situation) extras.push(fState.situation);
          if (fState.price === '가성비' || fState.price === '고급') extras.push(fState.price);
          if (fState.parking) extras.push('주차');
          const searchQuery = [searchLoc, pickedMenu, '맛집', ...extras].filter(Boolean).join(' ');
          const naverUrl = naverSearchUrl(searchQuery);
          const noLocNote = (fState.mode === 'gps' && !searchLoc)
            ? '<div style="font-size:0.78rem; color:var(--danger-color);">현재 위치(주소)를 확인하지 못해 메뉴 이름으로만 검색합니다. 위치 권한을 허용해 주세요.</div>' : '';

          resultBox.style.display = 'flex';
          resultBox.className = 'result-recommend-box';
          resultBox.innerHTML = `
            <div style="font-size:0.85rem; color:var(--text-muted); overflow-wrap:anywhere;">설정하신 조건 [${foodEsc(displayLoc)} / 반경 ${fState.radius} / ${cat}]에 딱 맞는 추천 메뉴!</div>
            <div class="recommend-title">🎉 ${foodEsc(pickedMenu)}</div>
            ${noLocNote}
            <div style="display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap; justify-content:center;">
              <a href="${naverUrl}" target="_blank" rel="noopener noreferrer" class="btn-primary" style="padding:0.5rem 1.2rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.4rem;">
                <i class="fa-solid fa-map-location-dot"></i> 네이버에서 맛집 조회하기
              </a>
              <button class="btn-secondary" id="saveFavMenuBtn" style="padding:0.5rem 1rem;"><i class="fa-solid fa-star" style="color:#f1c40f;"></i> 나의 메뉴 저장</button>
            </div>
          `;

          document.getElementById('saveFavMenuBtn').onclick = () => {
            const favs = appState.settings.foodFavorites;
            if (favs.length >= 100) {
              alert('나의 메뉴는 최대 100개까지만 저장할 수 있습니다.');
              return;
            }
            if (favs.some(f => f.menu === pickedMenu && f.location === displayLoc)) {
              alert('이미 나의 메뉴에 등록된 메뉴입니다.');
              return;
            }
            favs.unshift({
              id: 'fav-' + Date.now(),
              menu: pickedMenu,
              location: displayLoc,
              query: searchQuery,
              url: naverUrl,
              createdAt: new Date().toLocaleString()
            });
            saveState();
            renderFavoritesList();
            alert(`'${pickedMenu}' 메뉴가 나의 메뉴에 저장되었습니다!`);
          };
        };
      }, 50);
    }

    // 저장된 항목의 조회 주소 (이전 버전에서 저장된 옛 주소도 현행 주소로 변환)
    function favSearchUrl(fav) {
      const q = fav.query || `${(fav.location || '').replace(/현재 위치 \(위도[^)]*\)/, '').replace(/위도:[^/]*\/?/, '').trim()} ${fav.menu} 맛집`.trim();
      return naverSearchUrl(q);
    }

    function renderFavoritesList() {
      const container = document.getElementById('favoriteListContainer');
      const countEl = document.getElementById('favCount');
      if (!container) return;

      const favs = appState.settings.foodFavorites || [];
      countEl.textContent = favs.length;
      container.innerHTML = '';

      if (favs.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:0.8rem;">저장된 메뉴가 없습니다.</p>';
        return;
      }

      favs.forEach((fav, idx) => {
        const item = document.createElement('div');
        item.className = 'favorite-item';
        item.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:0.2rem; cursor:pointer; flex:1;" title="클릭하면 네이버 지도 맛집 검색으로 이동">
            <div style="font-weight:700; font-size:0.92rem; color:var(--primary-color);">⭐ ${fav.menu}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">위치: ${fav.location} (${fav.createdAt})</div>
          </div>
          <div style="display:flex; gap:0.4rem;">
            <a href="${favSearchUrl(fav)}" target="_blank" rel="noopener noreferrer" class="btn-icon-sm" title="맛집 조회"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            <button class="btn-icon-sm danger" title="삭제" onclick="window.deleteFoodFavorite(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        item.querySelector('div').onclick = () => {
          window.open(favSearchUrl(fav), '_blank', 'noopener,noreferrer');
        };
        container.appendChild(item);
      });
    }

    function deleteFoodFavorite(idx) {
      if (verifyDeletePassword() && confirm('이 메뉴를 삭제하시겠습니까?')) {
        appState.settings.foodFavorites.splice(idx, 1);
        saveState();
        renderFavoritesList();
      }
    }
    window.deleteFoodFavorite = deleteFoodFavorite;

    function renderAiView() {
      renderAiSidebar();
      renderAiContent();
    }

    function renderAiSidebar() {
      aiSidebarEl.innerHTML = '';
      const query = (searchInputEl?.value || '').trim().toLowerCase();

      AI_DIRECTORY.forEach(cat => {
        const filteredItems = cat.items.filter(item => 
          item.name.toLowerCase().includes(query) || 
          cat.category.toLowerCase().includes(query) ||
          item.description.toLowerCase().includes(query)
        );

        if (query && filteredItems.length === 0) return;

        const group = document.createElement('div');
        group.className = 'ai-category-group';

        const catTitle = document.createElement('div');
        catTitle.className = 'ai-category-title';
        catTitle.textContent = cat.category;
        group.appendChild(catTitle);

        const itemsToRender = query ? filteredItems : cat.items;
        itemsToRender.forEach(item => {
          const menuItem = document.createElement('div');
          menuItem.className = `ai-menu-item ${item.id === selectedAiId ? 'active' : ''}`;
          menuItem.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span>${item.name}</span>`;
          menuItem.onclick = () => {
            selectedAiId = item.id;
            renderAiView();
          };
          group.appendChild(menuItem);
        });

        aiSidebarEl.appendChild(group);
      });
    }

    function renderAiContent() {
      aiContentEl.innerHTML = '';
      let targetItem = null;

      for (const cat of AI_DIRECTORY) {
        const found = cat.items.find(i => i.id === selectedAiId);
        if (found) { targetItem = found; break; }
      }

      if (!targetItem) {
        targetItem = AI_DIRECTORY[0].items[0];
        selectedAiId = targetItem.id;
      }

      const headerCard = document.createElement('div');
      headerCard.className = 'ai-header-card';
      headerCard.innerHTML = `
        <div class="ai-header-info">
          <div class="ai-header-icon"><i class="fa-solid ${targetItem.icon}"></i></div>
          <div>
            <div class="ai-header-title">${targetItem.name}</div>
            <span class="ai-header-badge">${targetItem.provider}</span>
          </div>
        </div>
        <a href="${targetItem.url}" target="_blank" rel="noopener noreferrer" class="ai-launch-btn">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> ${targetItem.name} 실행하기
        </a>
      `;

      const descBox = document.createElement('div');
      descBox.className = 'ai-card-box';
      descBox.innerHTML = `<strong>소개:</strong> ${targetItem.description}`;

      const featGrid = document.createElement('div');
      featGrid.className = 'ai-features-grid';
      featGrid.innerHTML = `
        <div class="ai-feature-card">
          <div class="ai-feature-title"><i class="fa-solid fa-circle-check"></i> ${targetItem.feat1Title}</div>
          <div style="font-size:0.82rem; color:var(--text-muted);">${targetItem.feat1Desc}</div>
        </div>
        <div class="ai-feature-card">
          <div class="ai-feature-title"><i class="fa-solid fa-circle-check"></i> ${targetItem.feat2Title}</div>
          <div style="font-size:0.82rem; color:var(--text-muted);">${targetItem.feat2Desc}</div>
        </div>
      `;

      const promptCard = document.createElement('div');
      promptCard.className = 'ai-prompt-card';
      promptCard.innerHTML = `
        <div class="ai-prompt-header">
          <div class="ai-prompt-title"><i class="fa-solid fa-terminal"></i> 실무 추천 예시 프롬프트</div>
          <button class="btn-copy-prompt" id="copyPromptBtn"><i class="fa-regular fa-copy"></i> 복사하기</button>
        </div>
        <div class="ai-prompt-text" id="promptTextEl">${targetItem.prompt}</div>
      `;

      aiContentEl.appendChild(headerCard);
      aiContentEl.appendChild(descBox);
      aiContentEl.appendChild(featGrid);
      aiContentEl.appendChild(promptCard);

      setTimeout(() => {
        const copyBtn = document.getElementById('copyPromptBtn');
        if (copyBtn) {
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(targetItem.prompt).then(() => {
              copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> 복사 완료!';
              setTimeout(() => {
                copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> 복사하기';
              }, 1500);
            });
          };
        }
      }, 50);
    }

    function getColumnCount() {
      const width = window.innerWidth;
      if (width < 768) return 1;
      if (width < 1200) return 2;
      return 3;
    }

    function renderDashboard(filterQuery = '') {
      gridContainerEl.innerHTML = '';
      if (typeof activeTab === 'number' && activeTab >= appState.pages.length) {
        activeTab = 0;
      }
      const currentPage = appState.pages[activeTab];
      if (!currentPage || !currentPage.sections) return;

      const colCount = getColumnCount();
      const columns = [];
      for (let i = 0; i < colCount; i++) {
        const col = document.createElement('div');
        col.className = 'grid-column';
        columns.push(col);
        gridContainerEl.appendChild(col);
      }

      if (!filterQuery) {
        const newsCard = document.createElement('div');
        newsCard.className = 'section-card';

        const newsHeader = document.createElement('div');
        newsHeader.className = 'section-header';
        newsHeader.innerHTML = `
          <div class="section-title">
            <span><i class="fa-regular fa-newspaper" style="color:var(--primary-color);"></i> JTBC 주요뉴스</span>
            <span id="newsUpdateTime" style="font-size:0.75rem; font-weight:normal; color:var(--text-muted);">(--)</span>
          </div>
          <div class="section-actions">
            <button class="btn-icon-sm" id="refreshNewsBtn" title="뉴스 새로고침"><i class="fa-solid fa-arrows-rotate"></i></button>
          </div>
        `;
        newsCard.appendChild(newsHeader);

        const newsListEl = document.createElement('div');
        newsListEl.className = 'news-list';
        newsListEl.style.height = '260px';
        newsCard.appendChild(newsListEl);

        const newsMsgEl = document.createElement('div');
        newsMsgEl.id = 'newsMsg';
        newsCard.appendChild(newsMsgEl);

        columns[0].appendChild(newsCard);
        loadNewsList(newsListEl, document.getElementById('newsUpdateTime'), newsMsgEl);

        setTimeout(() => {
          const btn = document.getElementById('refreshNewsBtn');
          if (btn) btn.onclick = () => loadNewsList(newsListEl, document.getElementById('newsUpdateTime'), newsMsgEl);
        }, 100);
      }

      const totalSections = currentPage.sections.length;
      let visibleIdx = filterQuery ? 0 : 1;

      currentPage.sections.forEach((section, sIdx) => {
        const filteredLinks = section.links.filter(link => 
          link.name.toLowerCase().includes(filterQuery.toLowerCase()) || 
          link.url.toLowerCase().includes(filterQuery.toLowerCase())
        );

        if (filterQuery && filteredLinks.length === 0) return;

        const card = document.createElement('div');
        card.className = 'section-card';

        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = `
          <span class="section-title">${section.title}</span>
          <div class="section-actions">
            <button class="btn-icon-sm" title="위로 이동" onclick="window.moveSection(${sIdx}, -1)" ${sIdx === 0 ? 'disabled' : ''}><i class="fa-solid fa-chevron-up"></i></button>
            <button class="btn-icon-sm" title="아래로 이동" onclick="window.moveSection(${sIdx}, 1)" ${sIdx === totalSections - 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-down"></i></button>
            <button class="btn-icon-sm" title="링크 추가" onclick="window.openLinkModal('add', ${sIdx})"><i class="fa-solid fa-plus"></i></button>
            <button class="btn-icon-sm" title="카테고리 수정" onclick="window.openSectionModal('edit', ${sIdx})"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-icon-sm danger" title="링크 삭제" onclick="window.openDeleteLinkModal(${sIdx})"><i class="fa-solid fa-link-slash"></i></button>
          </div>
        `;
        card.appendChild(header);

        const linkList = document.createElement('div');
        linkList.className = 'link-list';
        const rawHeight = (section.height || '260px').toString().trim().toLowerCase();

        if (rawHeight === 'auto' || rawHeight === 'none' || rawHeight === '') {
          linkList.style.height = 'auto';
          linkList.style.maxHeight = 'none';
          linkList.style.overflow = 'visible';
        } else {
          const finalHeight = /^\d+$/.test(rawHeight) ? `${rawHeight}px` : rawHeight;
          linkList.style.height = finalHeight;
          linkList.style.maxHeight = finalHeight;
          linkList.style.overflowY = 'auto';
        }

        const linksToDisplay = filterQuery ? filteredLinks : section.links;

        linksToDisplay.forEach((link, lIdx) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'link-wrapper';

          const a = document.createElement('a');
          a.className = 'link-item';
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const img = document.createElement('img');
          img.className = 'favicon';
          img.src = getFaviconUrl(link.url);
          img.alt = link.name;
          img.onerror = function() {
            this.style.display = 'none';
            const fallback = document.createElement('div');
            fallback.className = 'monogram-icon';
            fallback.textContent = link.name.charAt(0);
            a.insertBefore(fallback, a.firstChild);
          };
          a.appendChild(img);

          const span = document.createElement('span');
          span.className = 'link-name';
          span.textContent = link.name;
          a.appendChild(span);

          const actions = document.createElement('div');
          actions.className = 'link-actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'btn-icon-sm';
          editBtn.title = '링크 수정';
          editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
          editBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            openLinkModal('edit', sIdx, lIdx);
          };

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-icon-sm danger';
          delBtn.title = '링크 삭제';
          delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
          delBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            deleteSingleLink(sIdx, lIdx);
          };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          wrapper.appendChild(a);
          wrapper.appendChild(actions);
          linkList.appendChild(wrapper);
        });

        card.appendChild(linkList);
        columns[visibleIdx % colCount].appendChild(card);
        visibleIdx++;
      });
    }

    function renderMemoView() {
      memoListEl.innerHTML = '';
      const query = (searchInputEl?.value || '').trim().toLowerCase();
      const allMemos = Array.isArray(appState.memos) ? appState.memos : [];
      const sortedMemos = [...allMemos].sort((a, b) => Number(!!b.important) - Number(!!a.important));
      const filteredMemos = query ? sortedMemos.filter(m =>
        String(m.title || '').toLowerCase().includes(query) ||
        String(m.content || '').toLowerCase().includes(query)
      ) : sortedMemos;

      if (filteredMemos.length === 0) {
        memoListEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:1rem;">검색 결과가 없거나 저장된 메모가 없습니다.</p>';
        const pager = document.getElementById('memoPagination');
        if (pager) pager.remove();
        if (!query) clearMemoEditor();
        return;
      }

      const totalPages = Math.max(1, Math.ceil(filteredMemos.length / MEMOS_PER_PAGE));
      memoCurrentPage = Math.min(Math.max(1, memoCurrentPage), totalPages);
      if (!selectedMemoId || !filteredMemos.some(m => m.id === selectedMemoId)) {
        selectedMemoId = filteredMemos[0].id;
      }
      const startIdx = (memoCurrentPage - 1) * MEMOS_PER_PAGE;
      const pageMemos = filteredMemos.slice(startIdx, startIdx + MEMOS_PER_PAGE);

      pageMemos.forEach(memo => {
        const item = document.createElement('div');
        item.className = `memo-item ${memo.id === selectedMemoId ? 'active' : ''}`;
        const title = document.createElement('div');
        title.className = 'memo-item-title';
        if (memo.important) {
          const tag = document.createElement('span');
          tag.className = 'memo-important-tag';
          tag.textContent = '★ 중요';
          title.appendChild(tag);
        }
        title.appendChild(document.createTextNode(memo.title || '제목 없음'));
        const date = document.createElement('div');
        date.className = 'memo-item-date';
        date.textContent = memo.createdAt || '';
        item.append(title, date);
        item.onclick = () => {
          selectedMemoId = memo.id;
          renderMemoView();
        };
        memoListEl.appendChild(item);
      });

      let pager = document.getElementById('memoPagination');
      if (pager) pager.remove();
      if (filteredMemos.length > MEMOS_PER_PAGE) {
        pager = document.createElement('div');
        pager.id = 'memoPagination';
        pager.className = 'memo-pagination';
        const prev = document.createElement('button');
        prev.textContent = '이전';
        prev.disabled = memoCurrentPage === 1;
        prev.onclick = () => { memoCurrentPage--; renderMemoView(); };
        const label = document.createElement('span');
        label.style.fontSize = '.8rem';
        label.textContent = `${memoCurrentPage} / ${totalPages}`;
        const next = document.createElement('button');
        next.textContent = '다음';
        next.disabled = memoCurrentPage === totalPages;
        next.onclick = () => { memoCurrentPage++; renderMemoView(); };
        pager.append(prev, label, next);
        memoListEl.parentElement.appendChild(pager);
      }

      const currentMemo = allMemos.find(m => m.id === selectedMemoId);
      if (currentMemo) {
        memoTitleInputEl.value = currentMemo.title || '';
        memoContentInputEl.value = currentMemo.content || '';
        memoImportantInputEl.checked = !!currentMemo.important;
        memoDateBadgeEl.innerHTML = `<i class="fa-regular fa-clock"></i> 작성일시: ${currentMemo.createdAt || ''}`;
      } else {
        clearMemoEditor();
      }
    }

    function clearMemoEditor() {
      selectedMemoId = null;
      memoTitleInputEl.value = '';
      memoContentInputEl.value = '';
      memoImportantInputEl.checked = false;
      memoDateBadgeEl.innerHTML = `<i class="fa-regular fa-clock"></i> 새 메모 작성 중`;
    }

    function saveMemo() {
      const title = memoTitleInputEl.value.trim() || '제목 없음';
      const content = memoContentInputEl.value.trim();
      const now = new Date();
      const dateString = `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}. ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      if (selectedMemoId) {
        const idx = appState.memos.findIndex(m => m.id === selectedMemoId);
        if (idx !== -1) {
          appState.memos[idx].title = title;
          appState.memos[idx].content = content;
          appState.memos[idx].important = memoImportantInputEl.checked;
          appState.memos[idx].createdAt = dateString;
        }
      } else {
        const newMemo = {
          id: 'memo-' + Date.now(),
          title: title,
          content: content,
          important: memoImportantInputEl.checked,
          createdAt: dateString
        };
        appState.memos.unshift(newMemo);
        selectedMemoId = newMemo.id;
      }

      memoCurrentPage = 1;
      saveState();
      renderMemoView();
      alert('메모가 저장되었습니다.');
    }

    function verifyDeletePassword() {
      const password = prompt('삭제 비밀번호를 입력하세요.');
      if (password === null) return false;
      if (password !== '7337') {
        alert('비밀번호가 올바르지 않습니다.');
        return false;
      }
      return true;
    }

    function deleteMemo() {
      if (!selectedMemoId) {
        alert('삭제할 메모가 선택되지 않았습니다.');
        return;
      }
      if (verifyDeletePassword() && confirm('현재 메모를 삭제하시겠습니까?')) {
        appState.memos = appState.memos.filter(m => m.id !== selectedMemoId);
        selectedMemoId = appState.memos.length > 0 ? appState.memos[0].id : null;
        saveState();
        renderMemoView();
      }
    }

    function moveSection(sIdx, direction) {
      const sections = appState.pages[activeTab].sections;
      const targetIdx = sIdx + direction;
      if (targetIdx < 0 || targetIdx >= sections.length) return;
      const temp = sections[sIdx];
      sections[sIdx] = sections[targetIdx];
      sections[targetIdx] = temp;
      saveState();
      renderCurrentView();
    }

    let sectionModalMode = 'add';
    let targetSectionIdx = null;
    let linkModalMode = 'add';
    let targetLinkSecIdx = 0;
    let targetLinkIdx = null;

    function openSectionModal(mode = 'add', sIdx = null) {
      sectionModalMode = mode;
      targetSectionIdx = sIdx;
      const presetValues = ['180px', '260px', '380px', 'auto'];

      if (mode === 'edit' && sIdx !== null) {
        sectionModalTitleEl.textContent = '카테고리 수정';
        const section = appState.pages[activeTab].sections[sIdx];
        sectionTitleInputEl.value = section.title;
        sectionOrderInputEl.value = sIdx + 1;
        const currentHeight = (section.height || '260px').toString().toLowerCase();

        if (presetValues.includes(currentHeight)) {
          sectionHeightSelectEl.value = currentHeight;
          sectionHeightInputEl.style.display = 'none';
          sectionHeightInputEl.value = currentHeight;
        } else {
          sectionHeightSelectEl.value = 'custom';
          sectionHeightInputEl.style.display = 'block';
          sectionHeightInputEl.value = section.height || '';
        }
      } else {
        sectionModalTitleEl.textContent = '카테고리 추가';
        sectionTitleInputEl.value = '';
        sectionOrderInputEl.value = appState.pages[activeTab].sections.length + 1;
        sectionHeightSelectEl.value = '260px';
        sectionHeightInputEl.style.display = 'none';
        sectionHeightInputEl.value = '260px';
      }
      sectionModalEl.classList.add('active');
    }

    function saveSection() {
      const title = sectionTitleInputEl.value.trim();
      const selectedOption = sectionHeightSelectEl.value;
      const orderVal = Math.max(1, parseInt(sectionOrderInputEl.value, 10) || 1);
      let finalHeight = '260px';

      if (!title) {
        alert('카테고리 이름을 입력하세요.');
        return;
      }

      if (selectedOption === 'custom') {
        const customValue = sectionHeightInputEl.value.trim();
        if (!customValue) finalHeight = '260px';
        else if (/^\d+$/.test(customValue)) finalHeight = customValue + 'px';
        else finalHeight = customValue;
      } else {
        finalHeight = selectedOption;
      }

      const sections = appState.pages[activeTab].sections;

      if (sectionModalMode === 'add') {
        const insertIdx = Math.max(0, Math.min(orderVal - 1, sections.length));
        sections.splice(insertIdx, 0, { title: title, height: finalHeight, links: [] });
      } else if (sectionModalMode === 'edit' && targetSectionIdx !== null) {
        const [section] = sections.splice(targetSectionIdx, 1);
        section.title = title;
        section.height = finalHeight;
        const insertIdx = Math.max(0, Math.min(orderVal - 1, sections.length));
        sections.splice(insertIdx, 0, section);
      }

      saveState();
      renderCurrentView();
      sectionModalEl.classList.remove('active');
    }

    function openDeleteSectionModal() {
      const sections = appState.pages[activeTab].sections;
      deleteSectionListEl.innerHTML = '';

      if (!sections || sections.length === 0) {
        deleteSectionListEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">삭제할 카테고리가 없습니다.</p>';
      } else {
        sections.forEach((sec, idx) => {
          const row = document.createElement('div');
          row.className = 'item-delete-row';
          row.innerHTML = `
            <span>${sec.title} (${sec.links.length}개 링크)</span>
            <button class="btn-icon-sm danger" title="카테고리 삭제" onclick="window.deleteSection(${idx})"><i class="fa-solid fa-trash"></i></button>
          `;
          deleteSectionListEl.appendChild(row);
        });
      }
      deleteSectionModalEl.classList.add('active');
    }

    function deleteSection(sIdx) {
      const sec = appState.pages[activeTab].sections[sIdx];
      if (verifyDeletePassword() && confirm(`'${sec.title}' 카테고리와 내부 전체 링크를 삭제하시겠습니까?`)) {
        appState.pages[activeTab].sections.splice(sIdx, 1);
        saveState();
        renderCurrentView();
        openDeleteSectionModal();
      }
    }

    function openLinkModal(mode = 'add', sIdx = 0, lIdx = null) {
      const currentPage = appState.pages[activeTab];
      if (!currentPage.sections || currentPage.sections.length === 0) {
        alert('먼저 카테고리를 하나 이상 추가해 주세요.');
        return;
      }

      linkModalMode = mode;
      targetLinkSecIdx = sIdx;
      targetLinkIdx = lIdx;

      linkSectionSelectEl.innerHTML = '';
      currentPage.sections.forEach((sec, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = sec.title;
        if (idx === sIdx) opt.selected = true;
        linkSectionSelectEl.appendChild(opt);
      });

      if (mode === 'edit' && lIdx !== null) {
        linkModalTitleEl.textContent = '링크 수정';
        const currentLink = currentPage.sections[sIdx].links[lIdx];
        linkNameInputEl.value = currentLink.name;
        linkUrlInputEl.value = currentLink.url;
        linkOrderInputEl.value = lIdx + 1;
      } else {
        linkModalTitleEl.textContent = '링크 추가';
        linkNameInputEl.value = '';
        linkUrlInputEl.value = '';
        const targetSec = currentPage.sections[sIdx];
        linkOrderInputEl.value = targetSec ? targetSec.links.length + 1 : 1;
      }

      linkModalEl.classList.add('active');
    }

    function saveLink() {
      const newSecIdx = parseInt(linkSectionSelectEl.value, 10);
      const name = linkNameInputEl.value.trim();
      let url = linkUrlInputEl.value.trim();
      const orderVal = parseInt(linkOrderInputEl.value, 10) || 1;

      if (!name || !url) {
        alert('이름과 URL을 모두 입력해 주세요.');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const sections = appState.pages[activeTab].sections;
      const newLink = { name, url, iconKind: 'auto' };

      if (linkModalMode === 'edit') {
        sections[targetLinkSecIdx].links.splice(targetLinkIdx, 1);
      }

      const targetLinks = sections[newSecIdx].links;
      const insertIdx = Math.max(0, Math.min(orderVal - 1, targetLinks.length));
      targetLinks.splice(insertIdx, 0, newLink);

      saveState();
      renderCurrentView();
      linkModalEl.classList.remove('active');
    }

    function openDeleteLinkModal(sIdx) {
      targetLinkSecIdx = sIdx;
      const section = appState.pages[activeTab].sections[sIdx];
      deleteLinkModalTitleEl.textContent = `'${section.title}' 링크 삭제`;
      deleteLinkListEl.innerHTML = '';

      if (!section.links || section.links.length === 0) {
        deleteLinkListEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">삭제할 링크가 없습니다.</p>';
      } else {
        section.links.forEach((link, lIdx) => {
          const row = document.createElement('div');
          row.className = 'item-delete-row';
          row.innerHTML = `
            <span>${link.name}</span>
            <button class="btn-icon-sm danger" title="링크 삭제" onclick="window.deleteSingleLink(${sIdx}, ${lIdx}, true)"><i class="fa-solid fa-trash"></i></button>
          `;
          deleteLinkListEl.appendChild(row);
        });
      }
      deleteLinkModalEl.classList.add('active');
    }

    function deleteSingleLink(sIdx, lIdx, fromModal = false) {
      if (verifyDeletePassword() && confirm('이 링크를 삭제하시겠습니까?')) {
        appState.pages[activeTab].sections[sIdx].links.splice(lIdx, 1);
        saveState();
        renderCurrentView();
        if (fromModal) openDeleteLinkModal(sIdx);
      }
    }

    function openBgModal() {
      tempBgImage = appState.settings.bgImage || '';
      bgSizeSelectEl.value = appState.settings.bgSize || 'cover';
      updateBgPreview();
      bgModalEl.classList.add('active');
    }

    function updateBgPreview() {
      const sizeVal = bgSizeSelectEl.value;
      if (tempBgImage) {
        bgPreviewBoxEl.style.backgroundImage = `url('${tempBgImage}')`;
        bgPreviewBoxEl.style.backgroundSize = sizeVal === 'repeat' ? 'auto' : sizeVal;
        bgPreviewBoxEl.style.backgroundRepeat = sizeVal === 'repeat' ? 'repeat' : 'no-repeat';
        bgPreviewBoxEl.innerHTML = '';
      } else {
        bgPreviewBoxEl.style.backgroundImage = 'none';
        bgPreviewBoxEl.innerHTML = '<span>이미지 없음</span>';
      }
    }

    function openOpacityModal() {
      const curOpacity = appState.settings.cardOpacity ?? 85;
      headerOpacityInputEl.value = curOpacity;
      headerOpacityValTextEl.textContent = curOpacity + '%';
      opacityModalEl.classList.add('active');
    }

    function setupEventListeners() {
      regionModalBtn.addEventListener('click', openRegionModal);
      closeRegionModalBtn.addEventListener('click', () => regionModalEl.classList.remove('active'));

      newMemoBtnEl.addEventListener('click', clearMemoEditor);
      saveMemoBtnEl.addEventListener('click', saveMemo);
      deleteMemoBtnEl.addEventListener('click', deleteMemo);

      sectionHeightSelectEl.addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
          sectionHeightInputEl.style.display = 'block';
          sectionHeightInputEl.focus();
        } else {
          sectionHeightInputEl.style.display = 'none';
        }
      });

      linkSectionSelectEl.addEventListener('change', (e) => {
        const selectedSecIdx = parseInt(e.target.value, 10);
        const sec = appState.pages[activeTab].sections[selectedSecIdx];
        if (linkModalMode === 'add') {
          linkOrderInputEl.value = sec ? sec.links.length + 1 : 1;
        } else if (linkModalMode === 'edit' && selectedSecIdx === targetLinkSecIdx) {
          linkOrderInputEl.value = targetLinkIdx + 1;
        } else {
          linkOrderInputEl.value = sec ? sec.links.length + 1 : 1;
        }
      });

      searchInputEl.addEventListener('input', (e) => {
        memoCurrentPage = 1;
        if (activeTab === 'memo') renderMemoView();
        else if (activeTab === 'ai') renderAiView();
        else if (activeTab === 'food') renderFoodView();
        else renderDashboard(e.target.value.trim());
      });

      searchInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const query = searchInputEl.value.trim();
          if (query) {
            if (query.startsWith('http://') || query.startsWith('https://')) {
              window.open(query, '_blank', 'noopener,noreferrer');
            } else {
              window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
          }
        }
      });

      window.addEventListener('resize', () => {
        if (activeTab !== 'memo' && activeTab !== 'ai' && activeTab !== 'food') renderDashboard(searchInputEl.value.trim());
      });

      addSectionHeaderBtn.addEventListener('click', () => openSectionModal('add'));
      deleteSectionHeaderBtn.addEventListener('click', openDeleteSectionModal);
      bgImageModalBtn.addEventListener('click', openBgModal);
      opacityHeaderBtn.addEventListener('click', openOpacityModal);

      exportBtn.addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `linkofy_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });

      importBtn.addEventListener('click', () => {
        importFileInput.click();
      });

      importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(evt) {
          try {
            const content = evt.target.result;
            let newPages = null;
            let newMemos = null;
            let newSettings = null;

            if (file.name.endsWith('.html') || file.name.endsWith('.htm') || content.trim().startsWith('<')) {
              const parsedSections = parseChromeBookmarksHtml(content);
              if (parsedSections && parsedSections.length > 0) {
                newPages = [{ name: "북마크", sections: parsedSections }];
              } else {
                alert('HTML 파일에서 유효한 북마크를 찾을 수 없습니다.');
                return;
              }
            } else {
              const importedData = JSON.parse(content);
              if (Array.isArray(importedData)) {
                newPages = importedData;
              } else if (importedData.pages && Array.isArray(importedData.pages)) {
                newPages = importedData.pages;
                newMemos = importedData.memos;
                newSettings = importedData.settings;
              } else if (importedData.sections && Array.isArray(importedData.sections)) {
                newPages = [{ name: importedData.name || "Home", sections: importedData.sections }];
              } else if (importedData.links && Array.isArray(importedData.links)) {
                newPages = [{ name: "Home", sections: [{ title: "가져온 링크", height: "auto", links: importedData.links }] }];
              } else if (importedData.memos && Array.isArray(importedData.memos)) {
                newMemos = importedData.memos;
              } else {
                alert('지원하지 않는 백업 파일 형식입니다.');
                return;
              }
            }

            if (newPages) appState.pages = newPages;
            if (newMemos) appState.memos = newMemos;
            if (newSettings) appState.settings = { ...appState.settings, ...newSettings };

            if (!appState.pages || appState.pages.length === 0) {
              appState.pages = [{ name: "Home", sections: [] }];
            }
            if (!appState.memos) appState.memos = [];

            activeTab = 0;
            await saveState();
            refreshUI();
            alert('데이터를 성공적으로 불러왔습니다!');
          } catch (err) {
            alert('파일을 불러오는 도중 오류가 발생했습니다: ' + err.message);
          }
        };
        reader.readAsText(file, 'UTF-8');
        e.target.value = '';
      });

      themeBtnEl.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        appState.settings.theme = currentTheme;
        applyTheme(currentTheme);
        saveState();
      });

      bgFileInputEl.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            tempBgImage = evt.target.result;
            updateBgPreview();
          };
          reader.readAsDataURL(file);
        }
      });

      bgSizeSelectEl.addEventListener('change', updateBgPreview);

      saveBgBtnEl.addEventListener('click', () => {
        appState.settings.bgImage = tempBgImage;
        appState.settings.bgSize = bgSizeSelectEl.value;
        applyBgStyle(appState.settings.bgImage, appState.settings.bgSize, appState.settings.cardOpacity);
        saveState();
        bgModalEl.classList.remove('active');
      });

      removeBgBtnEl.addEventListener('click', () => {
        tempBgImage = '';
        bgFileInputEl.value = '';
        updateBgPreview();
      });

      closeBgModalBtnEl.addEventListener('click', () => bgModalEl.classList.remove('active'));

      headerOpacityInputEl.addEventListener('input', (e) => {
        const opacityVal = e.target.value;
        headerOpacityValTextEl.textContent = opacityVal + '%';
        applyBgStyle(appState.settings.bgImage, appState.settings.bgSize, opacityVal);
      });

      saveOpacityBtnEl.addEventListener('click', () => {
        appState.settings.cardOpacity = parseInt(headerOpacityInputEl.value, 10);
        saveState();
        opacityModalEl.classList.remove('active');
      });

      closeOpacityModalBtnEl.addEventListener('click', () => {
        applyBgStyle(appState.settings.bgImage, appState.settings.bgSize || 'cover', appState.settings.cardOpacity);
        opacityModalEl.classList.remove('active');
      });

      closeSectionModalBtn.addEventListener('click', () => sectionModalEl.classList.remove('active'));
      saveSectionBtn.addEventListener('click', saveSection);

      closeDeleteSectionModalBtn.addEventListener('click', () => deleteSectionModalEl.classList.remove('active'));

      closeLinkModalBtn.addEventListener('click', () => linkModalEl.classList.remove('active'));
      saveLinkBtn.addEventListener('click', saveLink);

      closeDeleteLinkModalBtn.addEventListener('click', () => deleteLinkModalEl.classList.remove('active'));
    }

    window.moveSection = moveSection;
    window.openSectionModal = openSectionModal;
    window.openLinkModal = openLinkModal;
    window.openDeleteLinkModal = openDeleteLinkModal;
    window.deleteSection = deleteSection;
    window.deleteSingleLink = deleteSingleLink;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
