<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUS의 노트 & 뭘먹지 통합 시스템</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg-light: 255, 255, 255;
      --card-bg-dark: 45, 45, 65;
      --text-color: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --danger-color: #e74c3c;
      --up-color: #e5322d;
      --down-color: #1b6fe0;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
      --card-opacity: 0.85;
      --card-blur: none;
      --modal-blur: none;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e2e;
      --text-color: #f1f1f1;
      --text-muted: #a0a0a0;
      --border-color: #333344;
      --primary-color: #5c9ce6;
      --primary-hover: #4a82c4;
      --up-color: #ff6b64;
      --down-color: #6aa8ff;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 20px; transition: background-color 0.3s, color 0.3s; }

    .header { 
      display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1.5rem; 
      background: rgb(var(--card-bg-light)); backdrop-filter: blur(10px); 
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; gap: 0.8rem; flex-wrap: wrap; 
    }
    [data-theme="dark"] .header { background: rgb(var(--card-bg-dark)); }

    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-brand { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary-color); white-space: nowrap; }

    .nav-tabs { display: flex; gap: 0.4rem; align-items: center; }
    .tab-btn { background: none; border: none; padding: 0.35rem 0.75rem; font-size: 0.88rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .tab-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-color); }
    .tab-btn.active { background: var(--primary-color); color: #fff; }

    .search-box { flex: 1; max-width: 320px; position: relative; }
    .search-box input { width: 100%; padding: 0.4rem 1rem 0.4rem 2.2rem; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; font-size: 0.88rem; }
    .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }

    .header-actions { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .btn-icon { background: none; border: 1px solid var(--border-color); width: 34px; height: 34px; border-radius: 8px; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.88rem; transition: all 0.2s; }
    .btn-icon:hover { background: rgba(0,0,0,0.05); }

    .info-bar {
      max-width: 1400px; margin: 0.5rem auto 0; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted); flex-wrap: wrap; gap: 0.5rem;
    }
    .info-bar-left { display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .info-bar-right { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .sep { color: var(--border-color); }
    .market-up { color: var(--up-color); }
    .market-down { color: var(--down-color); }
    
    button#refreshStockBtn { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; }
    button#refreshStockBtn:hover { color: var(--text-color); }
    button#refreshStockBtn.spin svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.5rem; max-height: 350px; overflow-y: auto; padding-top: 0.5rem; }
    .region-chip { padding: 0.4rem; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; font-size: 0.85rem; cursor: pointer; background: var(--bg-color); color: var(--text-color); transition: all 0.2s; }
    .region-chip:hover, .region-chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .sido-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .sido-tab-btn { background: none; border: 1px solid var(--border-color); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; color: var(--text-color); }
    .sido-tab-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    .container { max-width: 1400px; margin: 0.8rem auto 1rem; padding: 0 1rem; }
    .grid-container { display: flex; gap: 1.2rem; width: 100%; }
    .grid-column { flex: 1; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }

    .section-card { 
      background: rgba(var(--card-bg-light), var(--card-opacity)); 
      backdrop-filter: var(--card-blur); 
      border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); padding: 0.9rem; display: flex; flex-direction: column; 
    }
    [data-theme="dark"] .section-card { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .section-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0.5rem; }
    .section-title { font-size: 0.98rem; font-weight: 700; color: var(--text-color); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .section-actions { display: flex; gap: 0.25rem; }
    .btn-icon-sm { background: none; border: none; padding: 0.25rem; color: var(--text-muted); cursor: pointer; border-radius: 4px; font-size: 0.82rem; }
    .btn-icon-sm:hover { color: var(--primary-color); background: rgba(0,0,0,0.05); }
    .btn-icon-sm.danger:hover { color: var(--danger-color); }

    .link-list { display: flex; flex-direction: column; gap: 0.35rem; padding-right: 0.2rem; }
    .link-wrapper { display: flex; align-items: center; justify-content: space-between; border-radius: 6px; padding: 0.2rem 0.4rem; transition: background 0.2s; }
    .link-wrapper:hover { background: rgba(0,0,0,0.04); }
    .link-item { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text-color); font-size: 0.88rem; flex: 1; overflow: hidden; }
    .favicon { width: 18px; height: 18px; border-radius: 3px; object-fit: contain; flex-shrink: 0; }
    .monogram-icon { width: 18px; height: 18px; border-radius: 3px; background: var(--primary-color); color: #fff; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-actions { display: flex; opacity: 0; transition: opacity 0.2s; gap: 0.2rem; }
    .link-wrapper:hover .link-actions { opacity: 1; }

    .news-list { display: flex; flex-direction: column; gap: 0.4rem; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    .news-item { text-decoration: none; color: var(--text-color); padding: 0.35rem; border-radius: 6px; border-bottom: 1px dashed var(--border-color); transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .news-item:hover { background: rgba(0,0,0,0.04); }
    .news-item-title { font-size: 0.86rem; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .news-item-time { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
    #newsMsg { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; word-break: break-all; }

    .memo-container { display: flex; gap: 1.2rem; height: calc(100vh - 110px); }
    .memo-sidebar { width: 250px; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    [data-theme="dark"] .memo-sidebar { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .memo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .memo-item { padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; }
    .memo-item:hover, .memo-item.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .memo-item-title { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .memo-item-date { font-size: 0.72rem; opacity: 0.8; margin-top: 0.2rem; }

    .memo-editor { flex: 1; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    [data-theme="dark"] .memo-editor { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .memo-editor input { font-size: 1.1rem; font-weight: 700; border: none; background: none; color: var(--text-color); outline: none; border-bottom: 2px solid var(--border-color); padding-bottom: 0.4rem; }
    .memo-editor textarea { flex: 1; border: none; background: none; color: var(--text-color); outline: none; resize: none; font-size: 0.95rem; line-height: 1.5; }
    .memo-editor-footer { display: flex; justify-content: space-between; align-items: center; }

    .ai-container { display: flex; gap: 1.2rem; height: calc(100vh - 110px); }
    .ai-sidebar { width: 280px; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 0.8rem; display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; flex-shrink: 0; }
    [data-theme="dark"] .ai-sidebar { background: rgba(var(--card-bg-dark), var(--card-opacity)); }
    
    .ai-category-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .ai-category-title { font-size: 0.78rem; font-weight: 800; color: var(--primary-color); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.4rem 0.5rem 0.2rem; border-bottom: 1px solid var(--border-color); margin-top: 0.4rem; }
    .ai-menu-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-color); cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
    .ai-menu-item:hover { background: rgba(0,0,0,0.05); }
    .ai-menu-item.active { background: var(--primary-color); color: #fff; }

    .ai-content { flex: 1; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 1.2rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
    [data-theme="dark"] .ai-content { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .ai-header-card { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.8rem; }
    .ai-header-info { display: flex; align-items: center; gap: 0.8rem; }
    .ai-header-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--primary-color); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .ai-header-title { font-size: 1.25rem; font-weight: 800; }
    .ai-header-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 12px; background: rgba(0,0,0,0.08); color: var(--text-muted); font-weight: 600; }

    .ai-launch-btn { background: var(--primary-color); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: background 0.2s; }
    .ai-launch-btn:hover { background: var(--primary-hover); }

    .ai-card-box { background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.9rem; font-size: 0.9rem; line-height: 1.5; }
    [data-theme="dark"] .ai-card-box { background: rgba(255,255,255,0.03); }

    .ai-features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.8rem; }
    .ai-feature-card { background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.8rem; }
    [data-theme="dark"] .ai-feature-card { background: rgba(255,255,255,0.03); }
    .ai-feature-title { font-weight: 700; font-size: 0.85rem; color: var(--primary-color); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }

    .ai-prompt-card { background: rgba(0,0,0,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.9rem; position: relative; }
    [data-theme="dark"] .ai-prompt-card { background: rgba(0,0,0,0.25); }
    .ai-prompt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .ai-prompt-title { font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 0.4rem; color: var(--text-color); }
    .ai-prompt-text { font-family: monospace, 'Courier New', Courier; font-size: 0.85rem; line-height: 1.55; white-space: pre-wrap; word-break: break-all; background: rgba(0,0,0,0.03); padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); color: var(--text-color); }
    .btn-copy-prompt { background: none; border: 1px solid var(--border-color); padding: 0.25rem 0.55rem; border-radius: 4px; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .btn-copy-prompt:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    /* ===== '뭘먹지' 탭 전용 레이아웃 & 스타일 ===== */
    .food-container { display: flex; flex-direction: column; gap: 1.2rem; width: 100%; }
    .food-card {
      background: rgba(var(--card-bg-light), var(--card-opacity));
      border: 1px solid var(--border-color); border-radius: 12px; padding: 1.2rem;
      display: flex; flex-direction: column; gap: 1rem; box-shadow: var(--card-shadow);
    }
    [data-theme="dark"] .food-card { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .switch-group { display: flex; background: rgba(0,0,0,0.05); padding: 0.3rem; border-radius: 10px; width: fit-content; gap: 0.3rem; }
    .switch-btn { border: none; background: none; padding: 0.45rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.88rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .switch-btn.active { background: var(--primary-color); color: #fff; }

    .form-row { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
    .food-select { padding: 0.45rem 0.7rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-weight: 600; font-size: 0.88rem; outline: none; }

    .food-category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.5rem; }
    .category-chip {
      padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.02); color: var(--text-color); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; text-align: center; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .category-chip:hover, .category-chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    .tag-chip {
      padding: 0.35rem 0.7rem; border-radius: 20px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-muted); font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .tag-chip.active { background: #27ae60; color: #fff; border-color: #27ae60; }

    .result-recommend-box {
      border: 2px dashed var(--primary-color); border-radius: 12px; padding: 1.5rem; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 1rem; background: rgba(74, 144, 226, 0.03);
    }
    .recommend-title { font-size: 1.4rem; font-weight: 800; color: var(--primary-color); }

    .favorite-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 400px; overflow-y: auto; }
    .favorite-item {
      display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem;
      border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color);
    }

    .login-guard-screen {
      background: rgba(var(--card-bg-light), var(--card-opacity));
      border: 1px solid var(--border-color); border-radius: 12px; padding: 4rem 1.5rem;
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; box-shadow: var(--card-shadow); margin-top: 1rem;
    }
    [data-theme="dark"] .login-guard-screen { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: rgb(var(--card-bg-light)); backdrop-filter: var(--modal-blur); border-radius: 12px; border: 1px solid var(--border-color); width: 90%; max-width: 480px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; box-shadow: var(--card-shadow); }
    [data-theme="dark"] .modal-box { background: rgb(var(--card-bg-dark)); }

    .modal-header { font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { display: flex; flex-direction: column; gap: 0.7rem; }
    #deleteSectionList, #deleteLinkList { max-height: min(60vh, 400px); overflow-y: auto; overscroll-behavior: contain; }
    .memo-pagination { display:flex; align-items:center; justify-content:center; gap:.5rem; padding-top:.4rem; }
    .memo-pagination button { border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); border-radius:5px; padding:.3rem .5rem; cursor:pointer; font-size: 0.8rem; }
    .memo-pagination button:disabled { opacity:.4; cursor:default; }
    .memo-important-tag { color:#d97706; font-size:.75rem; margin-right:.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select { padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; font-size: 0.88rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.4rem; }
    .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }

    .item-delete-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; }
    .bg-preview { width: 100%; height: 100px; border-radius: 8px; border: 1px dashed var(--border-color); display: flex; align-items: center; justify-content: center; background-position: center; background-size: cover; color: var(--text-muted); font-size: 0.82rem; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="header-brand">
        <i class="fa-solid fa-bookmark"></i> YUS의 노트
      </div>
      <div class="nav-tabs" id="pageTabs"></div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="검색어 또는 URL 입력...">
    </div>

    <div class="header-actions">
      <button class="btn-icon" id="regionModalBtn" title="날씨 지역 선택"><i class="fa-solid fa-location-dot"></i></button>
      <button class="btn-icon" id="addSectionHeaderBtn" title="카테고리 추가"><i class="fa-solid fa-folder-plus"></i></button>
      <button class="btn-icon" id="deleteSectionHeaderBtn" title="카테고리 삭제"><i class="fa-solid fa-folder-minus"></i></button>
      <button class="btn-icon" id="bgImageModalBtn" title="배경 이미지 설정"><i class="fa-solid fa-image"></i></button>
      <button class="btn-icon" id="opacityHeaderBtn" title="투명도 설정"><i class="fa-solid fa-sliders"></i></button>
      <button class="btn-icon" id="exportBtn" title="내보내기"><i class="fa-solid fa-download"></i></button>
      <button class="btn-icon" id="importBtn" title="불러오기"><i class="fa-solid fa-upload"></i></button>
      <input type="file" id="importFileInput" accept=".json,.html,.htm" style="display:none;">
      <button class="btn-icon" id="themeBtn" title="테마 변경"><i class="fa-solid fa-moon"></i></button>

    function parseRegionData() {
      DATA.split("|").forEach(block => {
        const [sido, rest] = block.split(":");
        regionGroups[sido] = [];
        rest.split(";").forEach(item => {
          const [name, lat, lon] = item.split(",");
          regionGroups[sido].push({ name, lat: +lat, lon: +lon });
        });
      });
    }

    function loadSavedRegion() {
      try {
        if (appState.settings && appState.settings.region) {
          currentRegion = appState.settings.region;
          return;
        }
        const saved = localStorage.getItem("wsbar-region-obj");
        if (saved) currentRegion = JSON.parse(saved);
      } catch (e) {}
    }

    function openRegionModal() {
      renderRegionModal(currentRegion.sido || "서울");
      regionModalEl.classList.add('active');
    }

    function renderRegionModal(activeSido) {
      sidoTabsEl.innerHTML = '';
      regionGridEl.innerHTML = '';
      Object.keys(regionGroups).forEach(sido => {
        const btn = document.createElement('button');
        btn.className = `sido-tab-btn ${sido === activeSido ? 'active' : ''}`;
        btn.textContent = sido;
        btn.onclick = () => renderRegionModal(sido);
        sidoTabsEl.appendChild(btn);
      });
      if (regionGroups[activeSido]) {
        regionGroups[activeSido].forEach(loc => {
          const chip = document.createElement('div');
          chip.className = `region-chip ${currentRegion.sido === activeSido && currentRegion.name === loc.name ? 'active' : ''}`;
          chip.textContent = loc.name;
          chip.onclick = () => {
            currentRegion = { sido: activeSido, name: loc.name, lat: loc.lat, lon: loc.lon };
            try { localStorage.setItem("wsbar-region-obj", JSON.stringify(currentRegion)); } catch(e){}
            if (!appState.settings) appState.settings = {};
            appState.settings.region = currentRegion;
            saveState();
            regionModalEl.classList.remove('active');
            updateWeather();
          };
          regionGridEl.appendChild(chip);
        });
      }
    }

    function startClockAndDataUpdater() {
      updateDateTime();
      setInterval(updateDateTime, 1000);
      updateWeather();
      updateStocks();
      refreshStockBtnEl.addEventListener("click", refreshAllWeatherStock);
      setInterval(updateWeather, 30 * 60 * 1000);
      setInterval(updateStocks, 5 * 60 * 1000);
    }

    function updateDateTime() {
      if (!currentDateTimeDisplayEl) return;
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const day = days[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      currentDateTimeDisplayEl.textContent = `${yyyy}.${mm}.${dd}. (${day}) ${hours}:${mins}:${secs}`;
    }

    async function updateWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentRegion.lat}&longitude=${currentRegion.lon}&current=temperature_2m,weather_code&timezone=Asia%2FSeoul`);
        const j = await res.json();
        const temp = Math.round(j.current.temperature_2m);
        const text = WEATHER_TEXT[j.current.weather_code] || "맑음";
        weatherDisplayEl.textContent = `${currentRegion.name} ${text} ${temp}°C`;
      } catch (e) {
        weatherDisplayEl.textContent = `${currentRegion.name} 날씨 --`;
      }
    }

    function showRate(el, rate) {
      if (rate === null || isNaN(rate)) { el.textContent = "--"; el.className = ""; return; }
      el.textContent = (rate > 0 ? "+" : "") + rate.toFixed(2) + "%";
      el.className = rate > 0 ? "market-up" : rate < 0 ? "market-down" : "";
    }

    const stockLast = {};
    let stockInflight = null;
    async function fetchJSONTimeout(url, ms = 5000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally { clearTimeout(t); }
    }

    function parseNaver(j) {
      const d = (j.datas && j.datas[0]) || j;
      let v = parseFloat(String(d.fluctuationsRatio).replace(/,/g, ""));
      return v;
    }

    async function fetchRate(code) {
      try {
        const j = await fetchJSONTimeout(`https://polling.finance.naver.com/api/realtime/domestic/index/${code}`);
        return parseNaver(j);
      } catch (e) { return null; }
    }

    function updateStocks() {
      if (stockInflight) return stockInflight;
      stockInflight = (async () => {
        const [a, b] = await Promise.all([fetchRate("KOSPI"), fetchRate("KOSDAQ")]);
        if (a !== null) stockLast.kospi = a;
        if (b !== null) stockLast.kosdaq = b;
        showRate(kospiDisplayEl, a ?? stockLast.kospi ?? null);
        showRate(kosdaqDisplayEl, b ?? stockLast.kosdaq ?? null);
      })().finally(() => { stockInflight = null; });
      return stockInflight;
    }

    async function refreshAllWeatherStock() {

    function setupAuthListeners() {
      const handleLoginClick = () => {
        provider.setCustomParameters({ prompt: 'select_account' });
        signInWithPopup(auth, provider).catch(err => alert("로그인 오류: " + err.message));
      };

      authBtn.addEventListener('click', () => {
        if (currentUser) {
          if (confirm("로그아웃 하시겠습니까?")) signOut(auth);
        } else {
          handleLoginClick();
        }
      });

      guardLoginBtnEl.addEventListener('click', handleLoginClick);

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
          authBtn.title = user.displayName ? `${user.displayName} (로그아웃)` : "로그아웃";

          syncFromFirestore(user.uid);

          authBtn.title = "구글 로그인";
          authBtn.style.color = "var(--text-color)";
          if (unsubscribeFirestore) { unsubscribeFirestore(); unsubscribeFirestore = null; }
        }
        renderCurrentView();
      });
    }

    function syncFromFirestore(uid) {
      if (unsubscribeFirestore) unsubscribeFirestore();
      const userDocRef = doc(db, "users", uid);
      unsubscribeFirestore = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const serverData = docSnap.data();
          if (serverData && serverData.pages) {
            appState = serverData;
            saveLocalBackup();
          }
          refreshUI();
        } else {
          saveState();
        }
      });
    }

            <div>
              <div style="font-weight:700; font-size:0.92rem;"><i class="fa-solid fa-satellite-dish" style="color:var(--primary-color);"></i> GPS 기반 맛집 탐색</div>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;" id="gpsStatusText">현재 위치: 위도:37.51, 경도:126.92 / 서울시 영등포구 신길로 41가길 34</div>
            </div>
            <button class="btn-primary" id="getGpsBtn" style="font-size:0.82rem; padding:0.35rem 0.8rem;"><i class="fa-solid fa-location-crosshairs"></i> 현재 위치 갱신</button>
          </div>
        `;
      } else {
        const sidoList = Object.keys(regionGroups);
        const sidoOptions = sidoList.map(s => `<option value="${s}" ${s === fState.sido ? 'selected' : ''}>${s}</option>`).join('');
        let gungooOptions = '';
        if (regionGroups[fState.sido]) {
          gungooOptions = regionGroups[fState.sido].map(g => `<option value="${g.name}" ${g.name === fState.gungoo ? 'selected' : ''}>${g.name}</option>`).join('');
        }

        locationArea.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:0.5rem; width:100%;">
            <div style="font-weight:700; font-size:0.92rem;"><i class="fa-solid fa-map" style="color:var(--primary-color);"></i> 주소 기반 맛집 탐색</div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <div class="form-group" style="flex:1; min-width:110px;">
                <label>1단계: 시/도 (필수)</label>
                <select class="food-select" id="addrSidoSelect" style="width:100%;">${sidoOptions}</select>
              </div>
              <div class="form-group" style="flex:1; min-width:110px;">
                <label>2단계: 시/군/구 (필수)</label>
                <select class="food-select" id="addrGungooSelect" style="width:100%;">${gungooOptions}</select>
              </div>
              <div class="form-group" style="flex:1; min-width:150px;">
                <label>3단계: 상세주소 (선택)</label>
                <input type="text" id="addrDongInput" class="food-select" placeholder="예: 신길로 34가길 34" value="${fState.dong || ''}" style="width:100%; height:34px;">
              </div>
            </div>
          </div>
        `;
      }
      mainCard.appendChild(locationArea);

      // 3. 반경 설정
      const radiusRow = document.createElement('div');
      radiusRow.className = 'form-row';
      const radii = ["300m", "500m", "1km", "2km", "5km"];
      let radiusChips = radii.map(r => `<button class="tag-chip ${fState.radius === r ? 'active' : ''}" data-radius="${r}">${r}</button>`).join('');
      radiusRow.innerHTML = `
        <span style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">거리 반경:</span>
        <div style="display:flex; gap:0.3rem;" id="radiusChipsContainer">${radiusChips}</div>
      `;
      mainCard.appendChild(radiusRow);

      // 4. 카테고리 그리드
      const catBox = document.createElement('div');
      catBox.style.display = 'flex';
      catBox.style.flexDirection = 'column';
      catBox.style.gap = '0.5rem';
      catBox.innerHTML = `
        <div style="font-size:0.88rem; font-weight:700;"><i class="fa-solid fa-list"></i> 카테고리 선택 (필수)</div>
        <div class="food-category-grid" id="foodCatGrid"></div>
      `;
      mainCard.appendChild(catBox);

      const catGridEl = catBox.querySelector('#foodCatGrid');
      FOOD_CATEGORIES.forEach(cat => {
        const chip = document.createElement('div');
        chip.className = `category-chip ${fState.category === cat ? 'active' : ''}`;
        chip.textContent = cat;
        chip.onclick = () => { fState.category = cat; saveState(); renderFoodView(); };
        catGridEl.appendChild(chip);
      });

      // 5. 취향 및 추천 버튼
      const actionRow = document.createElement('div');
      actionRow.style.textAlign = 'center';
      actionRow.style.marginTop = '0.5rem';
      actionRow.innerHTML = `
        <button class="btn-primary" id="recommendBtn" style="padding: 0.7rem 2rem; font-size: 1rem;"><i class="fa-solid fa-wand-magic-sparkles"></i> 추천해죠!</button>
      `;
      mainCard.appendChild(actionRow);

      const resultBox = document.createElement('div');
      resultBox.id = 'recommendResultBox';
      resultBox.style.display = 'none';
      mainCard.appendChild(resultBox);

      foodContainerEl.appendChild(mainCard);

      // 6. 나의 메뉴 즐겨찾기 카드
      const favCard = document.createElement('div');
      favCard.className = 'food-card';
      favCard.innerHTML = `
        <div style="font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:0.5rem;">
          <i class="fa-solid fa-star" style="color:#f1c40f;"></i> 나의 메뉴 (<span id="favCount">0</span>/100)
        </div>
        <div class="favorite-list" id="favoriteListContainer"></div>
      `;
      foodContainerEl.appendChild(favCard);
      renderFavoritesList();

      setTimeout(() => {
        document.getElementById('modeGpsBtn').onclick = () => { fState.mode = 'gps'; saveState(); renderFoodView(); };
        document.getElementById('modeAddrBtn').onclick = () => { fState.mode = 'address'; saveState(); renderFoodView(); };

        if (fState.mode === 'gps') {
          document.getElementById('getGpsBtn').onclick = () => {
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  const lat = pos.coords.latitude.toFixed(2);
                  const lon = pos.coords.longitude.toFixed(2);
                  currentGpsCoords.addressName = `위도:${lat}, 경도:${lon} / 서울시 영등포구 신길로 41가길 34`;
                  document.getElementById('gpsStatusText').textContent = `현재 위치: ${currentGpsCoords.addressName}`;
                  alert('현재 GPS 위치가 갱신되었습니다.');
                },
                (err) => { alert('GPS 오류: ' + err.message); }
              );
            }
          };
        } else {
          document.getElementById('addrSidoSelect').onchange = (e) => {
            fState.sido = e.target.value;
            fState.gungoo = regionGroups[fState.sido]?.[0]?.name || '';
            saveState(); renderFoodView();
          };
          document.getElementById('addrGungooSelect').onchange = (e) => {
            fState.gungoo = e.target.value;
            saveState(); renderFoodView();
          };
          document.getElementById('addrDongInput').oninput = (e) => {
            fState.dong = e.target.value;
            saveState();
          };
        }

        document.querySelectorAll('#radiusChipsContainer .tag-chip').forEach(btn => {
          btn.onclick = () => { fState.radius = btn.getAttribute('data-radius'); saveState(); renderFoodView(); };
        });

        document.getElementById('recommendBtn').onclick = () => {
          const cat = fState.category;
          let pool = cat === '전체 맛집' ? Object.values(MENU_DATABASE).flat() : (MENU_DATABASE[cat] || ["대표 메뉴"]);
          const pickedMenu = pool[Math.floor(Math.random() * pool.length)];

          let locationStr = fState.mode === 'gps' ? currentGpsCoords.addressName : `${fState.sido} ${fState.gungoo} ${fState.dong || ''}`.trim();
          const searchQuery = `${locationStr} ${pickedMenu} 맛집`;
          const naverUrl = `https://m.map.naver.com/search2/search.naver?query=${encodeURIComponent(searchQuery)}`;

          resultBox.style.display = 'flex';
          resultBox.className = 'result-recommend-box';
          resultBox.innerHTML = `
            <div style="font-size:0.85rem; color:var(--text-muted);">설정 위치 [${locationStr}] 주변 추천 메뉴!</div>
            <div class="recommend-title">🎉 ${pickedMenu}</div>
            <div style="display:flex; gap:0.8rem; align-items:center; justify-content:center; flex-wrap:wrap;">
              <a href="${naverUrl}" target="_blank" rel="noopener noreferrer" class="btn-primary" style="padding:0.5rem 1.2rem; text-decoration:none;">
                <i class="fa-solid fa-map-location-dot"></i> 네이버 맛집 조회하기
              </a>
              <button class="btn-secondary" id="saveFavMenuBtn" style="padding:0.5rem 1rem;"><i class="fa-solid fa-star" style="color:#f1c40f;"></i> 나의 메뉴 저장</button>
            </div>
          `;

          document.getElementById('saveFavMenuBtn').onclick = () => {
            const favs = appState.settings.foodFavorites;
            if (favs.length >= 100) { alert('즐겨찾기는 최대 100개까지 가능합니다.'); return; }
            favs.unshift({ id: 'fav-' + Date.now(), menu: pickedMenu, location: locationStr, url: naverUrl, createdAt: new Date().toLocaleString() });
            saveState(); renderFavoritesList();
            alert(`'${pickedMenu}' 메뉴가 나의 메뉴에 저장되었습니다.`);
          };
        };
      }, 50);
    }

    function renderFavoritesList() {
      const container = document.getElementById('favoriteListContainer');
      const countEl = document.getElementById('favCount');
      if (!container) return;
      const favs = appState.settings.foodFavorites || [];
      countEl.textContent = favs.length;
      container.innerHTML = '';
      if (favs.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:0.8rem;">저장된 나의 메뉴가 없습니다.</p>';
        return;
      }
      favs.forEach((fav, idx) => {
        const item = document.createElement('div');
        item.className = 'favorite-item';
        item.innerHTML = `
          <div style="cursor:pointer; flex:1;">
            <div style="font-weight:700; font-size:0.92rem; color:var(--primary-color);">⭐ ${fav.menu}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">위치: ${fav.location}</div>
          </div>
          <div style="display:flex; gap:0.4rem;">
            <a href="${fav.url}" target="_blank" rel="noopener noreferrer" class="btn-icon-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            <button class="btn-icon-sm danger" onclick="window.deleteFoodFavorite(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        item.querySelector('div').onclick = () => window.open(fav.url, '_blank');
        container.appendChild(item);
      });
    }

    function deleteFoodFavorite(idx) {
      if (confirm('삭제하시겠습니까?')) {
        appState.settings.foodFavorites.splice(idx, 1);
        saveState(); renderFavoritesList();
      }
    }
    window.deleteFoodFavorite = deleteFoodFavorite;

    function renderAiView() {
      aiSidebarEl.innerHTML = '';
      const cat = AI_DIRECTORY[0];
      const group = document.createElement('div');
      group.className = 'ai-category-group';
      cat.items.forEach(item => {
        const menuItem = document.createElement('div');
        menuItem.className = `ai-menu-item ${item.id === selectedAiId ? 'active' : ''}`;
        menuItem.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span>${item.name}</span>`;
        menuItem.onclick = () => { selectedAiId = item.id; renderAiView(); };
        group.appendChild(menuItem);
      });
      aiSidebarEl.appendChild(group);
      renderAiContent();
    }

    function renderAiContent() {
      aiContentEl.innerHTML = '';
      const targetItem = AI_DIRECTORY[0].items.find(i => i.id === selectedAiId) || AI_DIRECTORY[0].items[0];
      aiContentEl.innerHTML = `
        <div class="ai-header-card">
          <div class="ai-header-info">
            <div class="ai-header-icon"><i class="fa-solid ${targetItem.icon}"></i></div>
            <div><div class="ai-header-title">${targetItem.name}</div><span class="ai-header-badge">${targetItem.provider}</span></div>
          </div>
          <a href="${targetItem.url}" target="_blank" class="ai-launch-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> 실행하기</a>
        </div>
        <div class="ai-card-box"><strong>소개:</strong> ${targetItem.description}</div>
      `;
    }

    function renderDashboard(filterQuery = '') {
      gridContainerEl.innerHTML = '';
      const currentPage = appState.pages[activeTab];
      if (!currentPage || !currentPage.sections) return;
      const colCount = window.innerWidth < 768 ? 1 : 2;
      const columns = [];
      for (let i = 0; i < colCount; i++) {
        const col = document.createElement('div');
        col.className = 'grid-column';
        columns.push(col);
        gridContainerEl.appendChild(col);
      }
      currentPage.sections.forEach((section, sIdx) => {
        const card = document.createElement('div');
        card.className = 'section-card';
        card.innerHTML = `<div class="section-header"><span class="section-title">${section.title}</span></div>`;
        const linkList = document.createElement('div');
        linkList.className = 'link-list';
        section.links.forEach(link => {
          const wrapper = document.createElement('div');
          wrapper.className = 'link-wrapper';
          wrapper.innerHTML = `<a class="link-item" href="${link.url}" target="_blank"><img class="favicon" src="${getFaviconUrl(link.url)}"><span class="link-name">${link.name}</span></a>`;
          linkList.appendChild(wrapper);
        });
        card.appendChild(linkList);
        columns[sIdx % colCount].appendChild(card);
      });
    }

    function renderMemoView() {
      memoListEl.innerHTML = '';
      const memos = appState.memos || [];
      memos.forEach(m => {
        const item = document.createElement('div');
        item.className = `memo-item ${m.id === selectedMemoId ? 'active' : ''}`;
        item.textContent = m.title || '제목 없음';
        item.onclick = () => { selectedMemoId = m.id; renderMemoView(); };
        memoListEl.appendChild(item);
      });
      const cur = memos.find(m => m.id === selectedMemoId);
      if (cur) {
        memoTitleInputEl.value = cur.title || '';
        memoContentInputEl.value = cur.content || '';
      }
    }

    function saveMemo() {
      const title = memoTitleInputEl.value.trim() || '제목 없음';
      const content = memoContentInputEl.value.trim();
      if (selectedMemoId) {
        const m = appState.memos.find(x => x.id === selectedMemoId);
        if (m) { m.title = title; m.content = content; }
      } else {
        const newM = { id: 'memo-' + Date.now(), title, content, createdAt: new Date().toLocaleString() };
        appState.memos.unshift(newM);
        selectedMemoId = newM.id;
      }
      saveState(); renderMemoView(); alert('메모가 저장되었습니다.');
    }

    function setupEventListeners() {
      regionModalBtn.addEventListener('click', openRegionModal);
      closeRegionModalBtn.addEventListener('click', () => regionModalEl.classList.remove('active'));
      newMemoBtnEl.addEventListener('click', () => { selectedMemoId = null; memoTitleInputEl.value=''; memoContentInputEl.value=''; });
      saveMemoBtnEl.addEventListener('click', saveMemo);
      searchInputEl.addEventListener('input', (e) => {
        if (activeTab === 'memo') renderMemoView();
        else if (activeTab === 'ai') renderAiView();
        else if (activeTab === 'food') renderFoodView();
        else renderDashboard(e.target.value.trim());
      });
      themeBtnEl.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        appState.settings.theme = currentTheme;
        applyTheme(currentTheme); saveState();
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
    else initApp();
  </script>
</body>
</html>
