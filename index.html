<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUS의 노트</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg-light: 255, 255, 255;
      --card-bg-dark: 45, 45, 65;
      --text-color: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --danger-color: #e74c3c;
      --up-color: #e5322d;
      --down-color: #1b6fe0;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
      --card-opacity: 0.85;
      --card-blur: none;
      --modal-blur: none;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e2e;
      --text-color: #f1f1f1;
      --text-muted: #a0a0a0;
      --border-color: #333344;
      --primary-color: #5c9ce6;
      --primary-hover: #4a82c4;
      --up-color: #ff6b64;
      --down-color: #6aa8ff;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 20px; transition: background-color 0.3s, color 0.3s; }

    /* Header & Navigation */
    .header { 
      display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1.5rem; 
      background: rgb(var(--card-bg-light)); 
      backdrop-filter: blur(10px); 
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; gap: 0.8rem; flex-wrap: wrap; 
    }
    [data-theme="dark"] .header { background: rgb(var(--card-bg-dark)); }

    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-brand { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary-color); white-space: nowrap; }

    .nav-tabs { display: flex; gap: 0.4rem; align-items: center; }
    .tab-btn { background: none; border: none; padding: 0.35rem 0.75rem; font-size: 0.88rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .tab-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-color); }
    .tab-btn.active { background: var(--primary-color); color: #fff; }

    .search-box { flex: 1; max-width: 320px; position: relative; }
    .search-box input { width: 100%; padding: 0.4rem 1rem 0.4rem 2.2rem; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; font-size: 0.88rem; }
    .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }

    .header-actions { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .btn-icon { background: none; border: 1px solid var(--border-color); width: 34px; height: 34px; border-radius: 8px; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.88rem; transition: all 0.2s; }
    .btn-icon:hover { background: rgba(0,0,0,0.05); }

    /* Info Bar */
    .info-bar {
      max-width: 1400px; margin: 0.5rem auto 0; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted); flex-wrap: wrap; gap: 0.5rem;
    }
    .info-bar-left { display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .info-bar-right { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .sep { color: var(--border-color); }
    .market-up { color: var(--up-color); }
    .market-down { color: var(--down-color); }
    
    button#refreshStockBtn { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; }
    button#refreshStockBtn:hover { color: var(--text-color); }
    button#refreshStockBtn.spin svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 지역 선택 팝업 모달 내부 스타일 */
    .region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.5rem; max-height: 350px; overflow-y: auto; padding-top: 0.5rem; }
    .region-chip { padding: 0.4rem; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; font-size: 0.85rem; cursor: pointer; background: var(--bg-color); color: var(--text-color); transition: all 0.2s; }
    .region-chip:hover, .region-chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .sido-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .sido-tab-btn { background: none; border: 1px solid var(--border-color); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; color: var(--text-color); }
    .sido-tab-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    /* Main Container */
    .container { max-width: 1400px; margin: 0.8rem auto 1rem; padding: 0 1rem; }
    .grid-container { display: flex; gap: 1.2rem; width: 100%; }
    .grid-column { flex: 1; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }

    /* Section Card */
    .section-card { 
      background: rgba(var(--card-bg-light), var(--card-opacity)); 
      backdrop-filter: var(--card-blur); 
      border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); padding: 0.9rem; display: flex; flex-direction: column; 
    }
    [data-theme="dark"] .section-card { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .section-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0.5rem; }
    .section-title { font-size: 0.98rem; font-weight: 700; color: var(--text-color); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .section-actions { display: flex; gap: 0.25rem; }
    .btn-icon-sm { background: none; border: none; padding: 0.25rem; color: var(--text-muted); cursor: pointer; border-radius: 4px; font-size: 0.82rem; }
    .btn-icon-sm:hover { color: var(--primary-color); background: rgba(0,0,0,0.05); }
    .btn-icon-sm.danger:hover { color: var(--danger-color); }

    .link-list { display: flex; flex-direction: column; gap: 0.35rem; padding-right: 0.2rem; }
    .link-wrapper { display: flex; align-items: center; justify-content: space-between; border-radius: 6px; padding: 0.2rem 0.4rem; transition: background 0.2s; }
    .link-wrapper:hover { background: rgba(0,0,0,0.04); }
    .link-item { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text-color); font-size: 0.88rem; flex: 1; overflow: hidden; }
    .favicon { width: 18px; height: 18px; border-radius: 3px; object-fit: contain; flex-shrink: 0; }
    .monogram-icon { width: 18px; height: 18px; border-radius: 3px; background: var(--primary-color); color: #fff; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-actions { display: flex; opacity: 0; transition: opacity 0.2s; gap: 0.2rem; }
    .link-wrapper:hover .link-actions { opacity: 1; }

    /* News Component Styling */
    .news-list { display: flex; flex-direction: column; gap: 0.4rem; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    .news-item { text-decoration: none; color: var(--text-color); padding: 0.35rem; border-radius: 6px; border-bottom: 1px dashed var(--border-color); transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .news-item:hover { background: rgba(0,0,0,0.04); }
    .news-item-title { font-size: 0.86rem; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .news-item-time { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
    #newsMsg { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; word-break: break-all; }

    /* Memo Layout */
    .memo-container { display: flex; gap: 1.2rem; height: calc(100vh - 110px); }
    .memo-sidebar { width: 250px; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    [data-theme="dark"] .memo-sidebar { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .memo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .memo-item { padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; }
    .memo-item:hover, .memo-item.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .memo-item-title { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .memo-item-date { font-size: 0.72rem; opacity: 0.8; margin-top: 0.2rem; }

    .memo-editor { flex: 1; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    [data-theme="dark"] .memo-editor { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .memo-editor input { font-size: 1.1rem; font-weight: 700; border: none; background: none; color: var(--text-color); outline: none; border-bottom: 2px solid var(--border-color); padding-bottom: 0.4rem; }
    .memo-editor textarea { flex: 1; border: none; background: none; color: var(--text-color); outline: none; resize: none; font-size: 0.95rem; line-height: 1.5; }
    .memo-editor-footer { display: flex; justify-content: space-between; align-items: center; }

    /* AI Directory Layout */
    .ai-container { display: flex; gap: 1.2rem; height: calc(100vh - 110px); }
    .ai-sidebar { width: 280px; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 0.8rem; display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; flex-shrink: 0; }
    [data-theme="dark"] .ai-sidebar { background: rgba(var(--card-bg-dark), var(--card-opacity)); }
    
    .ai-category-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .ai-category-title { font-size: 0.78rem; font-weight: 800; color: var(--primary-color); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.4rem 0.5rem 0.2rem; border-bottom: 1px solid var(--border-color); margin-top: 0.4rem; }
    .ai-menu-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-color); cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
    .ai-menu-item:hover { background: rgba(0,0,0,0.05); }
    .ai-menu-item.active { background: var(--primary-color); color: #fff; }

    .ai-content { flex: 1; background: rgba(var(--card-bg-light), var(--card-opacity)); backdrop-filter: var(--card-blur); border-radius: 12px; border: 1px solid var(--border-color); padding: 1.2rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
    [data-theme="dark"] .ai-content { background: rgba(var(--card-bg-dark), var(--card-opacity)); }

    .ai-header-card { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.8rem; }
    .ai-header-info { display: flex; align-items: center; gap: 0.8rem; }
    .ai-header-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--primary-color); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .ai-header-title { font-size: 1.25rem; font-weight: 800; }
    .ai-header-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 12px; background: rgba(0,0,0,0.08); color: var(--text-muted); font-weight: 600; }

    .ai-launch-btn { background: var(--primary-color); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: background 0.2s; }
    .ai-launch-btn:hover { background: var(--primary-hover); }

    .ai-card-box { background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.9rem; font-size: 0.9rem; line-height: 1.5; }
    [data-theme="dark"] .ai-card-box { background: rgba(255,255,255,0.03); }

    .ai-features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.8rem; }
    .ai-feature-card { background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.8rem; }
    [data-theme="dark"] .ai-feature-card { background: rgba(255,255,255,0.03); }
    .ai-feature-title { font-weight: 700; font-size: 0.85rem; color: var(--primary-color); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }

    .ai-prompt-card { background: rgba(0,0,0,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.9rem; position: relative; }
    [data-theme="dark"] .ai-prompt-card { background: rgba(0,0,0,0.25); }
    .ai-prompt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .ai-prompt-title { font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 0.4rem; color: var(--text-color); }
    .ai-prompt-text { font-family: monospace, 'Courier New', Courier; font-size: 0.85rem; line-height: 1.55; white-space: pre-wrap; word-break: break-all; background: rgba(0,0,0,0.03); padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); color: var(--text-color); }
    .btn-copy-prompt { background: none; border: 1px solid var(--border-color); padding: 0.25rem 0.55rem; border-radius: 4px; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .btn-copy-prompt:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: rgb(var(--card-bg-light)); backdrop-filter: var(--modal-blur); border-radius: 12px; border: 1px solid var(--border-color); width: 90%; max-width: 480px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; box-shadow: var(--card-shadow); }
    [data-theme="dark"] .modal-box { background: rgb(var(--card-bg-dark)); }

    .modal-header { font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { display: flex; flex-direction: column; gap: 0.7rem; }
    #deleteSectionList, #deleteLinkList { max-height: min(60vh, 400px); overflow-y: auto; overscroll-behavior: contain; }
    .memo-pagination { display:flex; align-items:center; justify-content:center; gap:.5rem; padding-top:.4rem; }
    .memo-pagination button { border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); border-radius:5px; padding:.3rem .5rem; cursor:pointer; font-size: 0.8rem; }
    .memo-pagination button:disabled { opacity:.4; cursor:default; }
    .memo-important-tag { color:#d97706; font-size:.75rem; margin-right:.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select { padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; font-size: 0.88rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.4rem; }
    .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }

    .item-delete-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; }
    .bg-preview { width: 100%; height: 100px; border-radius: 8px; border: 1px dashed var(--border-color); display: flex; align-items: center; justify-content: center; background-position: center; background-size: cover; color: var(--text-muted); font-size: 0.82rem; }
  </style>
</head>
<body>

  <!-- Header Nav Bar -->
  <div class="header">
    <div class="header-left">
      <div class="header-brand">
        <i class="fa-solid fa-bookmark"></i> YUS의 노트
      </div>
      <div class="nav-tabs" id="pageTabs"></div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="검색어 또는 URL 입력...">
    </div>

    <div class="header-actions">
      <button class="btn-icon" id="regionModalBtn" title="날씨 지역 선택"><i class="fa-solid fa-location-dot"></i></button>
      <button class="btn-icon" id="addSectionHeaderBtn" title="카테고리 추가"><i class="fa-solid fa-folder-plus"></i></button>
      <button class="btn-icon" id="deleteSectionHeaderBtn" title="카테고리 삭제"><i class="fa-solid fa-folder-minus"></i></button>
      <button class="btn-icon" id="bgImageModalBtn" title="배경 이미지 설정"><i class="fa-solid fa-image"></i></button>
      <button class="btn-icon" id="opacityHeaderBtn" title="투명도 설정"><i class="fa-solid fa-sliders"></i></button>
      <button class="btn-icon" id="exportBtn" title="내보내기"><i class="fa-solid fa-download"></i></button>
      <button class="btn-icon" id="importBtn" title="불러오기"><i class="fa-solid fa-upload"></i></button>
      <input type="file" id="importFileInput" accept=".json,.html,.htm" style="display:none;">
      <button class="btn-icon" id="themeBtn" title="테마 변경"><i class="fa-solid fa-moon"></i></button>
      <button class="btn-icon" id="authBtn" title="구글 로그인"><i class="fa-brands fa-google"></i></button>
    </div>
  </div>

  <!-- Info Bar -->
  <div class="info-bar">
    <div class="info-bar-left">
      <i class="fa-regular fa-calendar-days" style="color:var(--primary-color);"></i>
      <span id="currentDateTimeDisplay">--</span>
    </div>
    <div class="info-bar-right">
      <span id="weatherDisplay">날씨 로딩 중…</span>
      <span class="sep">|</span>
      <span>코스피 <span id="kospiDisplay">…</span></span>
      <span class="sep">|</span>
      <span>코스닥 <span id="kosdaqDisplay">…</span></span>
      <span id="stockUpdateTime" style="font-size: 0.78rem; color: var(--text-muted);">(--)</span>
      <button id="refreshStockBtn" title="새로고침">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="grid-container" id="gridContainer"></div>

    <div class="memo-container" id="memoContainer" style="display: none;">
      <div class="memo-sidebar">
        <button class="btn-primary" id="newMemoBtn"><i class="fa-solid fa-plus"></i> 새 메모</button>
        <div class="memo-list" id="memoList"></div>
      </div>
      <div class="memo-editor">
        <input type="text" id="memoTitleInput" placeholder="메모 제목">
        <textarea id="memoContentInput" placeholder="내용을 입력하세요..."></textarea>
        <label style="display:flex;align-items:center;gap:.5rem;font-size:.88rem;"><input type="checkbox" id="memoImportantInput"> 중요 메모 (목록 상단 고정)</label>
        <div class="memo-editor-footer">
          <span id="memoDateBadge" style="font-size:0.78rem; color:var(--text-muted);"><i class="fa-regular fa-clock"></i> 작성일시</span>
          <div>
            <button class="btn-secondary" id="deleteMemoBtn"><i class="fa-solid fa-trash"></i> 삭제</button>
            <button class="btn-primary" id="saveMemoBtn"><i class="fa-solid fa-floppy-disk"></i> 저장</button>
          </div>
        </div>
      </div>
    </div>

    <!-- AI Directory Container -->
    <div class="ai-container" id="aiContainer" style="display: none;">
      <div class="ai-sidebar" id="aiSidebar"></div>
      <div class="ai-content" id="aiContent"></div>
    </div>
  </div>

  <!-- 지역 선택 팝업 모달 -->
  <div class="modal-overlay" id="regionModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>날씨 지역 선택</span>
        <button class="btn-icon-sm" id="closeRegionModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>

    function parseRegionData() {
      DATA.split("|").forEach(block => {
        const [sido, rest] = block.split(":");
        regionGroups[sido] = [];
        rest.split(";").forEach(item => {
          const [name, lat, lon] = item.split(",");
          regionGroups[sido].push({ name, lat: +lat, lon: +lon });
        });
      });
    }

    function loadSavedRegion() {
      try {
        if (appState.settings && appState.settings.region) {
          currentRegion = appState.settings.region;
          return;
        }
        const saved = localStorage.getItem("wsbar-region-obj");
        if (saved) {
          currentRegion = JSON.parse(saved);
        }
      } catch (e) {}
    }

    function openRegionModal() {
      renderRegionModal(currentRegion.sido || "서울");
      regionModalEl.classList.add('active');

    function renderRegionModal(activeSido) {
      sidoTabsEl.innerHTML = '';
      regionGridEl.innerHTML = '';

      Object.keys(regionGroups).forEach(sido => {
        const btn = document.createElement('button');
        btn.className = `sido-tab-btn ${sido === activeSido ? 'active' : ''}`;
        btn.textContent = sido;
        btn.onclick = () => renderRegionModal(sido);
        sidoTabsEl.appendChild(btn);
      });

      if (regionGroups[activeSido]) {
        regionGroups[activeSido].forEach(loc => {
          const chip = document.createElement('div');
          chip.className = `region-chip ${currentRegion.sido === activeSido && currentRegion.name === loc.name ? 'active' : ''}`;
          chip.textContent = loc.name;
          chip.onclick = () => {
            currentRegion = { sido: activeSido, name: loc.name, lat: loc.lat, lon: loc.lon };
            try { localStorage.setItem("wsbar-region-obj", JSON.stringify(currentRegion)); } catch(e){}
            if (!appState.settings) appState.settings = {};
            appState.settings.region = currentRegion;
            saveState();
            regionModalEl.classList.remove('active');
            updateWeather();
          };
          regionGridEl.appendChild(chip);
        });
      }

    function updateDateTime() {
      if (!currentDateTimeDisplayEl) return;
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const day = days[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      currentDateTimeDisplayEl.textContent = `${yyyy}.${mm}.${dd}. (${day}) ${hours}:${mins}:${secs}`;
    }

    async function updateWeather() {
      try {
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${currentRegion.lat}&longitude=${currentRegion.lon}&current=temperature_2m,weather_code&timezone=Asia%2FSeoul`;
        const res = await fetch(weatherUrl);
        const j = await res.json();
        const temp = Math.round(j.current.temperature_2m);
        const text = WEATHER_TEXT[j.current.weather_code] || "알 수 없음";
        weatherDisplayEl.textContent = `${currentRegion.name} ${text} ${temp}°C`;
        weatherDisplayEl.title = `${currentRegion.sido} ${currentRegion.name}`;
      } catch (e) {
        weatherDisplayEl.textContent = `${currentRegion.name} 날씨 --`;
      }
    }

    function showRate(el, rate) {
      if (rate === null || isNaN(rate)) { el.textContent = "--"; el.className = ""; return; }
      el.textContent = (rate > 0 ? "+" : "") + rate.toFixed(2) + "%";
      el.className = rate > 0 ? "market-up" : rate < 0 ? "market-down" : "";
    }

    /* ===== 증시 등락률: 타임아웃 + 동시 요청(먼저 성공한 값 사용) + 재시도 + 직전 값 유지 ===== */
    const stockLast = {};          // 마지막으로 성공한 값 (실패 시 화면에 유지)
    let stockInflight = null;      // 중복 호출 방지

    async function fetchJSONTimeout(url, ms = 5000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally { clearTimeout(t); }
    }

    function okRate(v) {
      if (!Number.isFinite(v) || Math.abs(v) > 30) throw new Error("invalid rate");
      return v;
    }
    function parseYahoo(j) {
      const m = j.chart.result[0].meta;
      const prev = m.previousClose ?? m.chartPreviousClose;
      return okRate((m.regularMarketPrice - prev) / prev * 100);
    }
    function parseNaver(j) {
      let v = parseFloat(String(j.fluctuationsRatio).replace(/,/g, ""));
      const code = j.compareToPreviousPrice && j.compareToPreviousPrice.code;
      if ((code === "4" || code === "5") && v > 0) v = -v;
      return okRate(v);
    }

    async function fetchRateOnce(yahooSym, naverCode) {
      const yahoo = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yahooSym)}?interval=1d&range=1d`;
      const naver = `https://m.stock.naver.com/api/index/${naverCode}/basic`;
      // 여러 경로를 동시에 요청하고, 가장 먼저 성공한 값을 사용
      return Promise.any([
        fetchJSONTimeout(yahoo).then(parseYahoo),
        fetchJSONTimeout(naver).then(parseNaver),
        fetchJSONTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(naver)}`, 7000)
          .then(d => parseNaver(JSON.parse(d.contents))),
        fetchJSONTimeout(`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(naver)}`, 7000)
          .then(parseNaver)
      ]);
    }

    async function fetchRate(yahooSym, naverCode) {
      for (let attempt = 0; attempt < 2; attempt++) {
        try { return await fetchRateOnce(yahooSym, naverCode); } catch (e) {}
        if (attempt === 0) await new Promise(r => setTimeout(r, 2000));   // 2초 뒤 한 번 재시도
      }
      return null;
    }

    function updateStocks() {
      if (stockInflight) return stockInflight;
      stockInflight = (async () => {
        const [a, b] = await Promise.all([fetchRate("^KS11", "KOSPI"), fetchRate("^KQ11", "KOSDAQ")]);
        if (a !== null) stockLast.kospi = a;
        if (b !== null) stockLast.kosdaq = b;
        showRate(kospiDisplayEl, a ?? stockLast.kospi ?? null);
        showRate(kosdaqDisplayEl, b ?? stockLast.kosdaq ?? null);

        // 하나라도 새로 가져왔을 때만 갱신 시각 변경
        if (a !== null || b !== null) {
          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          const hh = String(now.getHours()).padStart(2, '0');
          const min = String(now.getMinutes()).padStart(2, '0');
          if (stockUpdateTimeEl) {
            stockUpdateTimeEl.textContent = `${yyyy}.${mm}.${dd}. ${hh}:${min}`;
          }
        }
      })().finally(() => { stockInflight = null; });
      return stockInflight;
    }

    const pad = n => String(n).padStart(2, "0");
    function fmtDateTime(d) {
      return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    const fmtShort = d => `${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

    function stripTags(s) {
      const ta = document.createElement("textarea");
      ta.innerHTML = s.replace(/<[^>]+>/g, "");
      return ta.value.trim();
    }
    function parseDate(str) {
      if (!str) return null;
      let t = Date.parse(str);
      if (isNaN(t)) t = Date.parse(String(str).replace(" ", "T") + "Z");
      return isNaN(t) ? null : new Date(t);
    }

    async function loadNewsList(containerEl, timeEl, msgEl) {
      containerEl.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:1rem;">뉴스를 불러오는 중...</p>';
      
      try {
        const res = await fetch('news.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('news.json 없음');
        const data = await res.json();
        const items = (data.items || []).map(i => ({ title: i.title, link: i.link, date: i.date ? new Date(i.date) : null }));
        
        if (!items || items.length === 0) throw new Error('파싱 결과 없음');

        containerEl.innerHTML = '';
        const limit = Math.min(items.length, 8);
        for (let i = 0; i < limit; i++) {
          const item = items[i];
          const a = document.createElement('a');
          a.className = 'news-item';
          a.href = item.link.replace(/<!\[CDATA\[|\]\]>/g, "").trim();
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const titleEl = document.createElement('div');
          titleEl.className = 'news-item-title';
          titleEl.textContent = item.title;

          const timeElItem = document.createElement('div');
          timeElItem.className = 'news-item-time';
          timeElItem.textContent = item.date ? fmtShort(item.date) : '';

          a.appendChild(titleEl);
          a.appendChild(timeElItem);
          containerEl.appendChild(a);
        }

        const upd = data.updatedAt ? new Date(data.updatedAt) : new Date();
        if (timeEl) timeEl.textContent = fmtDateTime(upd);
        const staleMin = (Date.now() - upd.getTime()) / 60000;
        if (msgEl) msgEl.textContent = staleMin > 360 ? '※ 최근 6시간 동안 새 기사가 없거나 갱신이 지연되고 있습니다.' : '';
        return;
      } catch (e) {
        containerEl.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:1rem;">뉴스를 가져오지 못했습니다.</p>';
        if (timeEl) timeEl.textContent = '갱신 실패';
        if (msgEl) msgEl.textContent = '네트워크 응답 오류가 발생했습니다.';
      }
    }

          signInWithPopup(auth, provider).catch(err => alert("로그인 오류: " + err.message));
        }
      });

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
          authBtn.title = user.displayName ? `${user.displayName} (로그아웃)` : "로그아웃";
          authBtn.style.color = "var(--primary-color)";
          syncFromFirestore(user.uid);
        } else {
          authBtn.title = "구글 로그인";
          authBtn.style.color = "var(--text-color)";
          if (unsubscribeFirestore) {
            unsubscribeFirestore();
            unsubscribeFirestore = null;
          }
          // [수정] 일시적인 인증 끊김 시 데이터가 초기화되지 않도록 로컬 백업/현재 상태를 그대로 유지
        }
      });
    }

    function syncFromFirestore(uid) {
      if (unsubscribeFirestore) unsubscribeFirestore();
      const userDocRef = doc(db, "users", uid);
      unsubscribeFirestore = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const serverData = docSnap.data();
          if (serverData && serverData.pages && serverData.pages.length > 0) {
            appState = serverData;
            saveLocalBackup();
          }
          if (!appState.pages) appState.pages = [];
          if (!appState.memos) appState.memos = [];
          if (!appState.settings) appState.settings = { theme: 'light', openNewPage: false, bgImage: '', bgSize: 'cover', cardOpacity: 85, region: null };
          if (appState.settings.region) {
            currentRegion = appState.settings.region;
            try { localStorage.setItem("wsbar-region-obj", JSON.stringify(currentRegion)); } catch(e){}
            updateWeather();
          }
          refreshUI();
        } else {
          // 서버에 문서가 없으면 현재 로컬 백업 데이터를 서버에 업로드하여 유실 방지
          saveState();
        }
      });
    }

    async function saveState() {
      saveLocalBackup();
      if (currentUser) {
        try {
          const userDocRef = doc(db, "users", currentUser.uid);
          await setDoc(userDocRef, appState);
        } catch (err) {
          console.error("Firestore 저장 오류:", err);
          alert("서버 저장 실패! 상세오류: " + err.message);
        }
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtnEl.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      applyBgStyle(appState.settings?.bgImage || '', appState.settings?.bgSize || 'cover', appState.settings?.cardOpacity ?? 85);
    }

    function applyBgStyle(bgDataUrl, bgSize = 'cover', opacity = 85) {
      const numericOpacity = Number(opacity);
      const opacityVal = Math.max(0, Math.min(100, Number.isFinite(numericOpacity) ? numericOpacity : 85)) / 100;
      document.documentElement.style.setProperty('--card-opacity', String(opacityVal));
      document.documentElement.style.setProperty('--card-blur', 'none');
      document.documentElement.style.setProperty('--modal-blur', 'none');

      if (bgDataUrl) {
        document.body.style.backgroundImage = `url('${bgDataUrl}')`;
        document.body.style.backgroundSize = bgSize;
        document.body.style.backgroundRepeat = bgSize === 'repeat' ? 'repeat' : 'no-repeat';
        document.body.style.backgroundPosition = 'center center';
        document.body.style.backgroundAttachment = bgSize === 'repeat' ? 'scroll' : 'fixed';
      } else {
        document.body.style.backgroundImage = 'none';
      }
    }

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch (e) {
        return '';
      }
    }

    function parseChromeBookmarksHtml(htmlContent) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      const sections = [];
      const h3Tags = doc.querySelectorAll('h3');
      if (h3Tags.length > 0) {
        h3Tags.forEach(h3 => {
          const title = h3.textContent.trim() || '북마크';
          const dl = h3.nextElementSibling;
          const links = [];
          if (dl && dl.tagName === 'DL') {
            const aTags = dl.querySelectorAll('a');
            aTags.forEach(a => {
              if (a.href && a.textContent) {
                links.push({ name: a.textContent.trim(), url: a.href, iconKind: 'auto' });
              }
            });
          }
          if (links.length > 0) {
            sections.push({ title, height: 'auto', links });
          }
        });
      }
      if (sections.length === 0) {
        const allLinks = [];
        doc.querySelectorAll('a').forEach(a => {
          if (a.href && a.textContent) {
            allLinks.push({ name: a.textContent.trim(), url: a.href, iconKind: 'auto' });
          }
        });
        if (allLinks.length > 0) {
          sections.push({ title: '불러온 북마크', height: 'auto', links: allLinks });
        }
      }
      return sections;
    }

    function renderMemoView() {
      memoListEl.innerHTML = '';
      const query = (searchInputEl?.value || '').trim().toLowerCase();
      const allMemos = Array.isArray(appState.memos) ? appState.memos : [];
      const sortedMemos = [...allMemos].sort((a, b) => Number(!!b.important) - Number(!!a.important));
      const filteredMemos = query ? sortedMemos.filter(m =>
        String(m.title || '').toLowerCase().includes(query) ||
        String(m.content || '').toLowerCase().includes(query)
      ) : sortedMemos;

      if (filteredMemos.length === 0) {
        memoListEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:1rem;">검색 결과가 없거나 저장된 메모가 없습니다.</p>';
        const pager = document.getElementById('memoPagination');
        if (pager) pager.remove();
        if (!query) clearMemoEditor();
        return;
      }

      const totalPages = Math.max(1, Math.ceil(filteredMemos.length / MEMOS_PER_PAGE));
      memoCurrentPage = Math.min(Math.max(1, memoCurrentPage), totalPages);
      if (!selectedMemoId || !filteredMemos.some(m => m.id === selectedMemoId)) {
        selectedMemoId = filteredMemos[0].id;
      }
      const startIdx = (memoCurrentPage - 1) * MEMOS_PER_PAGE;
      const pageMemos = filteredMemos.slice(startIdx, startIdx + MEMOS_PER_PAGE);

      pageMemos.forEach(memo => {
        const item = document.createElement('div');
        item.className = `memo-item ${memo.id === selectedMemoId ? 'active' : ''}`;
        const title = document.createElement('div');
        title.className = 'memo-item-title';
        if (memo.important) {
          const tag = document.createElement('span');
          tag.className = 'memo-important-tag';
          tag.textContent = '★ 중요';
          title.appendChild(tag);
        }
        title.appendChild(document.createTextNode(memo.title || '제목 없음'));
        const date = document.createElement('div');
        date.className = 'memo-item-date';
        date.textContent = memo.createdAt || '';
        item.append(title, date);
        item.onclick = () => {
          selectedMemoId = memo.id;
          renderMemoView();
        };
        memoListEl.appendChild(item);
      });

      let pager = document.getElementById('memoPagination');
      if (pager) pager.remove();
      if (filteredMemos.length > MEMOS_PER_PAGE) {
        pager = document.createElement('div');
        pager.id = 'memoPagination';
        pager.className = 'memo-pagination';
        const prev = document.createElement('button');
        prev.textContent = '이전';
        prev.disabled = memoCurrentPage === 1;
        prev.onclick = () => { memoCurrentPage--; renderMemoView(); };
        const label = document.createElement('span');
        label.style.fontSize = '.8rem';
        label.textContent = `${memoCurrentPage} / ${totalPages}`;
        const next = document.createElement('button');
        next.textContent = '다음';
        next.disabled = memoCurrentPage === totalPages;
        next.onclick = () => { memoCurrentPage++; renderMemoView(); };
        pager.append(prev, label, next);
        memoListEl.parentElement.appendChild(pager);
      }

      const currentMemo = allMemos.find(m => m.id === selectedMemoId);
      if (currentMemo) {
        memoTitleInputEl.value = currentMemo.title || '';
        memoContentInputEl.value = currentMemo.content || '';
        memoImportantInputEl.checked = !!currentMemo.important;
        memoDateBadgeEl.innerHTML = `<i class="fa-regular fa-clock"></i> 작성일시: ${currentMemo.createdAt || ''}`;
      } else {
        clearMemoEditor();
      }
    }

    function clearMemoEditor() {
      selectedMemoId = null;
      memoTitleInputEl.value = '';
      memoContentInputEl.value = '';
      memoImportantInputEl.checked = false;
      memoDateBadgeEl.innerHTML = `<i class="fa-regular fa-clock"></i> 새 메모 작성 중`;
    }

    function saveMemo() {
      const title = memoTitleInputEl.value.trim() || '제목 없음';
      const content = memoContentInputEl.value.trim();
      const now = new Date();
      const dateString = `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}. ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      if (selectedMemoId) {
        const idx = appState.memos.findIndex(m => m.id === selectedMemoId);
        if (idx !== -1) {
          appState.memos[idx].title = title;
          appState.memos[idx].content = content;
          appState.memos[idx].important = memoImportantInputEl.checked;
          appState.memos[idx].createdAt = dateString;
        }
      } else {
        const newMemo = {
          id: 'memo-' + Date.now(),
          title: title,
          content: content,
          important: memoImportantInputEl.checked,
          createdAt: dateString
        };
        appState.memos.unshift(newMemo);
        selectedMemoId = newMemo.id;
      }

      memoCurrentPage = 1;
      saveState();
      renderMemoView();
      alert('메모가 저장되었습니다.');
    }

    function verifyDeletePassword() {
      const password = prompt('삭제 비밀번호를 입력하세요.');
      if (password === null) return false;
      if (password !== '7337') {
        alert('비밀번호가 올바르지 않습니다.');
        return false;
      }
      return true;
    }

    function deleteMemo() {
      if (!selectedMemoId) {
        alert('삭제할 메모가 선택되지 않았습니다.');
        return;
      }
      if (verifyDeletePassword() && confirm('현재 메모를 삭제하시겠습니까?')) {
        appState.memos = appState.memos.filter(m => m.id !== selectedMemoId);
        selectedMemoId = appState.memos.length > 0 ? appState.memos[0].id : null;
        saveState();
        renderMemoView();
      }
    }

    function moveSection(sIdx, direction) {
      const sections = appState.pages[activeTab].sections;
      const targetIdx = sIdx + direction;
      if (targetIdx < 0 || targetIdx >= sections.length) return;
      const temp = sections[sIdx];
      sections[sIdx] = sections[targetIdx];
      sections[targetIdx] = temp;
      saveState();
      renderCurrentView();
    }

    let sectionModalMode = 'add';
    let targetSectionIdx = null;
    let linkModalMode = 'add';
    let targetLinkSecIdx = 0;
    let targetLinkIdx = null;

    function openSectionModal(mode = 'add', sIdx = null) {
      sectionModalMode = mode;
      targetSectionIdx = sIdx;
      const presetValues = ['180px', '260px', '380px', 'auto'];

      if (mode === 'edit' && sIdx !== null) {
        sectionModalTitleEl.textContent = '카테고리 수정';
        const section = appState.pages[activeTab].sections[sIdx];
        sectionTitleInputEl.value = section.title;
        sectionOrderInputEl.value = sIdx + 1;
        const currentHeight = (section.height || '260px').toString().toLowerCase();

        if (presetValues.includes(currentHeight)) {
          sectionHeightSelectEl.value = currentHeight;
          sectionHeightInputEl.style.display = 'none';
          sectionHeightInputEl.value = currentHeight;
        } else {
          sectionHeightSelectEl.value = 'custom';
          sectionHeightInputEl.style.display = 'block';
          sectionHeightInputEl.value = section.height || '';
        }
      } else {
        sectionModalTitleEl.textContent = '카테고리 추가';
        sectionTitleInputEl.value = '';
        sectionOrderInputEl.value = appState.pages[activeTab].sections.length + 1;
        sectionHeightSelectEl.value = '260px';
        sectionHeightInputEl.style.display = 'none';
        sectionHeightInputEl.value = '260px';
      }
      sectionModalEl.classList.add('active');
    }

    function saveSection() {
      const title = sectionTitleInputEl.value.trim();
      const selectedOption = sectionHeightSelectEl.value;
      const orderVal = Math.max(1, parseInt(sectionOrderInputEl.value, 10) || 1);
      let finalHeight = '260px';

      if (!title) {
        alert('카테고리 이름을 입력하세요.');
        return;
      }

      if (selectedOption === 'custom') {
        const customValue = sectionHeightInputEl.value.trim();
        if (!customValue) finalHeight = '260px';
        else if (/^\d+$/.test(customValue)) finalHeight = customValue + 'px';
        else finalHeight = customValue;
      } else {
        finalHeight = selectedOption;
      }

      const sections = appState.pages[activeTab].sections;

      if (sectionModalMode === 'add') {
        const insertIdx = Math.max(0, Math.min(orderVal - 1, sections.length));
        sections.splice(insertIdx, 0, { title: title, height: finalHeight, links: [] });
      } else if (sectionModalMode === 'edit' && targetSectionIdx !== null) {
        const [section] = sections.splice(targetSectionIdx, 1);
        section.title = title;
        section.height = finalHeight;
        const insertIdx = Math.max(0, Math.min(orderVal - 1, sections.length));
        sections.splice(insertIdx, 0, section);
      }

      saveState();
      renderCurrentView();
      sectionModalEl.classList.remove('active');
    }

    function openDeleteSectionModal() {
      const sections = appState.pages[activeTab].sections;
      deleteSectionListEl.innerHTML = '';

      if (!sections || sections.length === 0) {
        deleteSectionListEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">삭제할 카테고리가 없습니다.</p>';
      } else {
        sections.forEach((sec, idx) => {
          const row = document.createElement('div');
          row.className = 'item-delete-row';
          row.innerHTML = `
            <span>${sec.title} (${sec.links.length}개 링크)</span>
            <button class="btn-icon-sm danger" title="카테고리 삭제" onclick="window.deleteSection(${idx})"><i class="fa-solid fa-trash"></i></button>
          `;
          deleteSectionListEl.appendChild(row);
        });
      }
      deleteSectionModalEl.classList.add('active');
    }

    function deleteSection(sIdx) {
      const sec = appState.pages[activeTab].sections[sIdx];
      if (verifyDeletePassword() && confirm(`'${sec.title}' 카테고리와 내부 전체 링크를 삭제하시겠습니까?`)) {
        appState.pages[activeTab].sections.splice(sIdx, 1);
        saveState();
        renderCurrentView();
        openDeleteSectionModal();
      }
    }

    function openLinkModal(mode = 'add', sIdx = 0, lIdx = null) {
      const currentPage = appState.pages[activeTab];
      if (!currentPage.sections || currentPage.sections.length === 0) {
        alert('먼저 카테고리를 하나 이상 추가해 주세요.');
        return;
      }

      linkModalMode = mode;
      targetLinkSecIdx = sIdx;
      targetLinkIdx = lIdx;

      linkSectionSelectEl.innerHTML = '';
      currentPage.sections.forEach((sec, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = sec.title;
        if (idx === sIdx) opt.selected = true;
        linkSectionSelectEl.appendChild(opt);
      });

      if (mode === 'edit' && lIdx !== null) {
        linkModalTitleEl.textContent = '링크 수정';
        const currentLink = currentPage.sections[sIdx].links[lIdx];
        linkNameInputEl.value = currentLink.name;
        linkUrlInputEl.value = currentLink.url;
        linkOrderInputEl.value = lIdx + 1;
      } else {
        linkModalTitleEl.textContent = '링크 추가';
        linkNameInputEl.value = '';
        linkUrlInputEl.value = '';
        const targetSec = currentPage.sections[sIdx];
        linkOrderInputEl.value = targetSec ? targetSec.links.length + 1 : 1;
      }

      linkModalEl.classList.add('active');
    }

    function saveLink() {
      const newSecIdx = parseInt(linkSectionSelectEl.value, 10);
      const name = linkNameInputEl.value.trim();
      let url = linkUrlInputEl.value.trim();
      const orderVal = parseInt(linkOrderInputEl.value, 10) || 1;

      if (!name || !url) {
        alert('이름과 URL을 모두 입력해 주세요.');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const sections = appState.pages[activeTab].sections;
      const newLink = { name, url, iconKind: 'auto' };

      if (linkModalMode === 'edit') {
        sections[targetLinkSecIdx].links.splice(targetLinkIdx, 1);
      }

      const targetLinks = sections[newSecIdx].links;
      const insertIdx = Math.max(0, Math.min(orderVal - 1, targetLinks.length));
      targetLinks.splice(insertIdx, 0, newLink);

      saveState();
      renderCurrentView();
      linkModalEl.classList.remove('active');
    }

    function openDeleteLinkModal(sIdx) {
      targetLinkSecIdx = sIdx;
      const section = appState.pages[activeTab].sections[sIdx];
      deleteLinkModalTitleEl.textContent = `'${section.title}' 링크 삭제`;
      deleteLinkListEl.innerHTML = '';

      if (!section.links || section.links.length === 0) {
        deleteLinkListEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">삭제할 링크가 없습니다.</p>';
      } else {
        section.links.forEach((link, lIdx) => {
          const row = document.createElement('div');
          row.className = 'item-delete-row';
          row.innerHTML = `
            <span>${link.name}</span>
            <button class="btn-icon-sm danger" title="링크 삭제" onclick="window.deleteSingleLink(${sIdx}, ${lIdx}, true)"><i class="fa-solid fa-trash"></i></button>
          `;
          deleteLinkListEl.appendChild(row);
        });
      }
      deleteLinkModalEl.classList.add('active');
    }

    function deleteSingleLink(sIdx, lIdx, fromModal = false) {
      if (verifyDeletePassword() && confirm('이 링크를 삭제하시겠습니까?')) {
        appState.pages[activeTab].sections[sIdx].links.splice(lIdx, 1);
        saveState();
        renderCurrentView();
        if (fromModal) openDeleteLinkModal(sIdx);
      }
    }

    function openBgModal() {
      tempBgImage = appState.settings.bgImage || '';
      bgSizeSelectEl.value = appState.settings.bgSize || 'cover';
      updateBgPreview();
      bgModalEl.classList.add('active');
    }

    function updateBgPreview() {
      const sizeVal = bgSizeSelectEl.value;
      if (tempBgImage) {
        bgPreviewBoxEl.style.backgroundImage = `url('${tempBgImage}')`;
        bgPreviewBoxEl.style.backgroundSize = sizeVal === 'repeat' ? 'auto' : sizeVal;
        bgPreviewBoxEl.style.backgroundRepeat = sizeVal === 'repeat' ? 'repeat' : 'no-repeat';
        bgPreviewBoxEl.innerHTML = '';
      } else {
        bgPreviewBoxEl.style.backgroundImage = 'none';
        bgPreviewBoxEl.innerHTML = '<span>이미지 없음</span>';
      }
    }

    function openOpacityModal() {
      const curOpacity = appState.settings.cardOpacity ?? 85;
      headerOpacityInputEl.value = curOpacity;
      headerOpacityValTextEl.textContent = curOpacity + '%';
      opacityModalEl.classList.add('active');
    }

    function setupEventListeners() {
      regionModalBtn.addEventListener('click', openRegionModal);
      closeRegionModalBtn.addEventListener('click', () => regionModalEl.classList.remove('active'));

      newMemoBtnEl.addEventListener('click', clearMemoEditor);
      saveMemoBtnEl.addEventListener('click', saveMemo);
      deleteMemoBtnEl.addEventListener('click', deleteMemo);

      sectionHeightSelectEl.addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
          sectionHeightInputEl.style.display = 'block';
          sectionHeightInputEl.focus();
        } else {
          sectionHeightInputEl.style.display = 'none';
        }
      });

      linkSectionSelectEl.addEventListener('change', (e) => {
        const selectedSecIdx = parseInt(e.target.value, 10);
        const sec = appState.pages[activeTab].sections[selectedSecIdx];
        if (linkModalMode === 'add') {
          linkOrderInputEl.value = sec ? sec.links.length + 1 : 1;
        } else if (linkModalMode === 'edit' && selectedSecIdx === targetLinkSecIdx) {
          linkOrderInputEl.value = targetLinkIdx + 1;
        } else {
          linkOrderInputEl.value = sec ? sec.links.length + 1 : 1;
        }
      });

      searchInputEl.addEventListener('input', (e) => {
        memoCurrentPage = 1;
        if (activeTab === 'memo') renderMemoView();
        else if (activeTab === 'ai') renderAiView();
        else renderDashboard(e.target.value.trim());
      });
      searchInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const query = searchInputEl.value.trim();
          if (query) {
            if (query.startsWith('http://') || query.startsWith('https://')) {
              window.open(query, '_blank', 'noopener,noreferrer');
            } else {
              window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
          }
        }
      });

      window.addEventListener('resize', () => {
        if (activeTab !== 'memo' && activeTab !== 'ai') renderDashboard(searchInputEl.value.trim());
      });

      addSectionHeaderBtn.addEventListener('click', () => openSectionModal('add'));
      deleteSectionHeaderBtn.addEventListener('click', openDeleteSectionModal);
      bgImageModalBtn.addEventListener('click', openBgModal);
      opacityHeaderBtn.addEventListener('click', openOpacityModal);

      exportBtn.addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `linkofy_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });

      importBtn.addEventListener('click', () => {
        importFileInput.click();
      });

      importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(evt) {
          try {
            const content = evt.target.result;
            let newPages = null;
            let newMemos = null;
            let newSettings = null;

            if (file.name.endsWith('.html') || file.name.endsWith('.htm') || content.trim().startsWith('<')) {
              const parsedSections = parseChromeBookmarksHtml(content);
              if (parsedSections && parsedSections.length > 0) {
                newPages = [{ name: "북마크", sections: parsedSections }];
              } else {
                alert('HTML 파일에서 유효한 북마크를 찾을 수 없습니다.');
                return;
              }
            } else {
              const importedData = JSON.parse(content);
              if (Array.isArray(importedData)) {
                newPages = importedData;
              } else if (importedData.pages && Array.isArray(importedData.pages)) {
                newPages = importedData.pages;
                newMemos = importedData.memos;
                newSettings = importedData.settings;
              } else if (importedData.sections && Array.isArray(importedData.sections)) {
                newPages = [{ name: importedData.name || "Home", sections: importedData.sections }];
              } else if (importedData.links && Array.isArray(importedData.links)) {
                newPages = [{ name: "Home", sections: [{ title: "가져온 링크", height: "auto", links: importedData.links }] }];
              } else if (importedData.memos && Array.isArray(importedData.memos)) {
                newMemos = importedData.memos;
              } else {
                alert('지원하지 않는 백업 파일 형식입니다.');
                return;
              }
            }

            if (newPages) appState.pages = newPages;
            if (newMemos) appState.memos = newMemos;
            if (newSettings) appState.settings = { ...appState.settings, ...newSettings };

            if (!appState.pages || appState.pages.length === 0) {
              appState.pages = [{ name: "Home", sections: [] }];
            }
            if (!appState.memos) appState.memos = [];

            activeTab = 0;
            await saveState();
            refreshUI();
            alert('데이터를 성공적으로 불러왔습니다!');
          } catch (err) {
            alert('파일을 불러오는 도중 오류가 발생했습니다: ' + err.message);
          }
        };
        reader.readAsText(file, 'UTF-8');
        e.target.value = '';
      });

      themeBtnEl.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        appState.settings.theme = currentTheme;
        applyTheme(currentTheme);
        saveState();
      });

      bgFileInputEl.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            tempBgImage = evt.target.result;
            updateBgPreview();
          };
          reader.readAsDataURL(file);
        }
      });

      bgSizeSelectEl.addEventListener('change', updateBgPreview);

      saveBgBtnEl.addEventListener('click', () => {
        appState.settings.bgImage = tempBgImage;
        appState.settings.bgSize = bgSizeSelectEl.value;
        applyBgStyle(appState.settings.bgImage, appState.settings.bgSize, appState.settings.cardOpacity);
        saveState();
        bgModalEl.classList.remove('active');
      });

      removeBgBtnEl.addEventListener('click', () => {
        tempBgImage = '';
        bgFileInputEl.value = '';
        updateBgPreview();
      });

      closeBgModalBtnEl.addEventListener('click', () => bgModalEl.classList.remove('active'));

      headerOpacityInputEl.addEventListener('input', (e) => {
        const opacityVal = e.target.value;
        headerOpacityValTextEl.textContent = opacityVal + '%';
        applyBgStyle(appState.settings.bgImage, appState.settings.bgSize, opacityVal);
      });

      saveOpacityBtnEl.addEventListener('click', () => {
        appState.settings.cardOpacity = parseInt(headerOpacityInputEl.value, 10);
        saveState();
        opacityModalEl.classList.remove('active');
      });

      closeOpacityModalBtnEl.addEventListener('click', () => {
        applyBgStyle(appState.settings.bgImage, appState.settings.bgSize || 'cover', appState.settings.cardOpacity);
        opacityModalEl.classList.remove('active');
      });

      closeSectionModalBtn.addEventListener('click', () => sectionModalEl.classList.remove('active'));
      saveSectionBtn.addEventListener('click', saveSection);

      closeDeleteSectionModalBtn.addEventListener('click', () => deleteSectionModalEl.classList.remove('active'));

      closeLinkModalBtn.addEventListener('click', () => linkModalEl.classList.remove('active'));
      saveLinkBtn.addEventListener('click', saveLink);

      closeDeleteLinkModalBtn.addEventListener('click', () => deleteLinkModalEl.classList.remove('active'));
    }

    window.moveSection = moveSection;
    window.openSectionModal = openSectionModal;
    window.openLinkModal = openLinkModal;
    window.openDeleteLinkModal = openDeleteLinkModal;
    window.deleteSection = deleteSection;
    window.deleteSingleLink = deleteSingleLink;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
